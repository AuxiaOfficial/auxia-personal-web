<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际争霸 III · 回合制博弈（同人二创）</title>
<style>
/* ================= 基础与主题 ================= */
:root {
  --bg-deep: #060913;
  --bg-panel: rgba(18, 26, 48, 0.85);
  --bg-panel-2: rgba(28, 38, 66, 0.75);
  --line: rgba(108, 148, 224, 0.28);
  --text: #d8e2f5;
  --text-dim: #8a99b8;
  --accent: #5ec8ff;       /* 水晶蓝 */
  --accent-2: #a78bff;     /* 星灵紫 */
  --gold: #ffd76e;         /* 水晶金 */
  --red: #ff6b7a;
  --green: #6ee7a0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(80, 60, 160, 0.25), transparent 60%),
    radial-gradient(900px 500px at 90% 110%, rgba(30, 90, 160, 0.22), transparent 60%),
    var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  overflow-x: auto;
}
#app { max-width: 1400px; margin: 0 auto; padding: 18px 26px 40px; min-width: 1024px; }

/* 星点背景 */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 40px 60px, rgba(255,255,255,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 160px 200px, rgba(255,255,255,.25) 50%, transparent 51%),
    radial-gradient(2px 2px at 300px 90px, rgba(200,220,255,.30) 50%, transparent 51%),
    radial-gradient(1px 1px at 480px 330px, rgba(255,255,255,.22) 50%, transparent 51%),
    radial-gradient(1px 1px at 700px 150px, rgba(255,255,255,.30) 50%, transparent 51%),
    radial-gradient(2px 2px at 900px 420px, rgba(200,220,255,.25) 50%, transparent 51%),
    radial-gradient(1px 1px at 1100px 250px, rgba(255,255,255,.28) 50%, transparent 51%);
}
#app { position: relative; z-index: 1; }

.screen { display: none; }
.screen.active { display: block; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h1, h2, h3 { font-weight: 700; letter-spacing: .04em; }
button {
  font-family: inherit; cursor: pointer; border: 1px solid var(--line);
  background: var(--bg-panel-2); color: var(--text); border-radius: 8px;
  padding: 10px 22px; font-size: 15px; transition: all .15s ease;
}
button:hover:not(:disabled) { border-color: var(--accent); box-shadow: 0 0 12px rgba(94,200,255,.25); transform: translateY(-1px); }
button:disabled { opacity: .38; cursor: not-allowed; }
button.primary {
  background: linear-gradient(135deg, rgba(94,200,255,.22), rgba(167,139,255,.25));
  border-color: var(--accent); color: #eaf6ff; font-size: 18px; padding: 14px 48px;
}
button.ghost { background: transparent; }
button.danger { border-color: rgba(255,107,122,.5); color: var(--red); }

.panel {
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 22px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
}

/* ================= 标题屏 ================= */
#screen-title { text-align: center; padding-top: 6vh; }
.game-title { font-size: 96px; color: #eaf6ff; text-shadow: 0 0 28px rgba(94,200,255,.55), 0 0 70px rgba(167,139,255,.4); }
.game-title .t3 {
  background: linear-gradient(180deg, var(--gold), #ff9d5c);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.subtitle { color: var(--text-dim); margin: 14px 0 54px; font-size: 18px; letter-spacing: .42em; }
.mode-row { display: flex; gap: 22px; justify-content: center; margin-bottom: 34px; }
.mode-btn { font-size: 27px; padding: 24px 66px; border-radius: 16px; position: relative; }
.mode-btn.selected {
  border-color: var(--gold); color: var(--gold);
  background: linear-gradient(135deg, rgba(255,215,110,.12), rgba(255,157,92,.10));
  box-shadow: 0 0 18px rgba(255,215,110,.25);
}
.ai-options {
  display: none; margin: 0 auto 36px; width: 620px; text-align: left;
  background: var(--bg-panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 26px; font-size: 17px;
}
.ai-options.visible { display: block; }
.ai-options label { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.difficulty-row { display: flex; gap: 30px; margin-top: 14px; padding-left: 30px; }
.difficulty-row label { font-size: 16px; }
.title-actions { display: flex; gap: 18px; justify-content: center; margin-top: 14px; }
.title-actions button { font-size: 17px; padding: 14px 36px; }
.footnote { margin-top: 60px; color: var(--text-dim); font-size: 14px; }

/* ================= 选人屏 ================= */
#screen-select h2, #screen-copy h2, #screen-handoff h2, #screen-roster h2 { text-align: center; margin-bottom: 10px; font-size: 32px; }
.select-hint { text-align: center; color: var(--text-dim); margin-bottom: 18px; font-size: 15.5px; }
.char-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.char-card {
  background: var(--bg-panel-2); border: 1px solid var(--line); border-radius: 14px;
  padding: 15px 17px; cursor: pointer; transition: all .12s ease; position: relative;
}
.char-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.char-card.selected { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,215,110,.3); background: rgba(60,50,20,.35); }
.char-card.disabled { opacity: .35; cursor: not-allowed; }
.char-card .cc-head { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 700; }
.char-card .cc-icon { font-size: 24px; }
.char-card .cc-tier { font-size: 11px; color: var(--text-dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: auto; }
.char-card .cc-stats { display: flex; gap: 13px; margin-top: 8px; font-size: 14.5px; color: var(--text-dim); }
.char-card .cc-stats b { color: var(--text); }
.select-actions { display: flex; justify-content: center; gap: 18px; margin-top: 24px; }
.select-actions button { font-size: 16px; padding: 12px 32px; }
.lineup-strip { margin-top: 16px; text-align: center; font-size: 15.5px; color: var(--text-dim); }
.lineup-strip b { color: var(--gold); }

/* ================= 交接屏 ================= */
#screen-handoff { text-align: center; padding-top: 16vh; }
.handoff-big { font-size: 30px; margin: 26px 0; color: #eaf6ff; }
.handoff-big .pname { color: var(--gold); }
.handoff-tip { color: var(--text-dim); margin-bottom: 34px; }

/* ================= 战场总览（炉石式大卡，常驻顶部） ================= */
.battlefield { display: grid; grid-template-columns: 1fr 52px 1fr; gap: 12px; align-items: stretch; margin-bottom: 14px; }
.bf-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bf-label { font-size: 14px; letter-spacing: .3em; color: var(--gold); text-align: center; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.bf-vs { display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(255,215,110,.55); }
.bf-cards { display: flex; gap: 10px; }
.bcard {
  flex: 1 1 0; min-width: 138px; border-radius: 14px; padding: 10px 12px 11px; position: relative;
  background: linear-gradient(180deg, rgba(32,45,80,.95), rgba(19,27,50,.95));
  border: 1px solid var(--line); box-shadow: 0 5px 18px rgba(0,0,0,.45);
}
.bcard.dead { opacity: .38; filter: grayscale(.9); }
.bc-head { display: flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 800; }
.bc-icon { font-size: 21px; }
.bc-form { font-size: 11px; color: var(--accent-2); margin-left: auto; white-space: nowrap; }
.bc-hpbar { height: 10px; border-radius: 5px; background: rgba(0,0,0,.55); margin: 8px 0; overflow: hidden; }
.bc-hpbar .hp-fill { background: linear-gradient(90deg, #2ecc71, #6ee7a0); height: 100%; transition: width .3s; }
.bc-stats { display: flex; gap: 6px; }
.bstat {
  flex: 1; text-align: center; font-size: 17px; font-weight: 800; border-radius: 9px; padding: 5px 2px;
  background: rgba(0,0,0,.38); border: 1px solid rgba(255,255,255,.09);
}
.bstat small { font-size: 11px; font-weight: 400; color: var(--text-dim); }
.bstat.atk { color: #ffab7e; border-color: rgba(255,157,107,.4); }
.bstat.hp  { color: #7ef0ae; border-color: rgba(126,240,174,.32); }
.bstat.inc { color: var(--gold); border-color: rgba(255,215,110,.38); }
.bc-econ { display: flex; justify-content: space-between; margin-top: 7px; font-size: 12.5px; color: var(--text-dim); }
.bc-econ b { color: var(--text); font-size: 14px; }
.bc-marks { margin-top: 5px; min-height: 18px; display: flex; gap: 4px; flex-wrap: wrap; }
.bc-deadtag { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; letter-spacing: .25em; color: var(--red); text-shadow: 0 0 14px rgba(255,107,122,.75); }
.mark { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; color: var(--accent); background: rgba(94,200,255,.08); }
.mark.bad { color: var(--red); border-color: rgba(255,107,122,.4); background: rgba(255,107,122,.08); }
.mark.gold { color: var(--gold); border-color: rgba(255,215,110,.4); }

/* ================= 规划屏 ================= */
.plan-topbar {
  display: flex; align-items: center; gap: 22px; background: var(--bg-panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; margin-bottom: 12px;
}
.plan-topbar .pt-title { font-size: 16px; font-weight: 700; }
.plan-topbar .pt-num { font-size: 20px; font-weight: 700; color: var(--gold); }
.plan-topbar .pt-num.small { font-size: 14px; }
.plan-topbar .warn { color: var(--red); font-size: 13px; }
.plan-body { display: grid; grid-template-columns: 340px 1fr; gap: 12px; }
.alloc-group { margin-bottom: 14px; }
.alloc-group h4 { font-size: 13px; color: var(--accent); margin-bottom: 6px; letter-spacing: .1em; }
.alloc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.alloc-row label { width: 82px; flex: none; font-size: 14px; color: var(--text-dim); white-space: nowrap; }
.alloc-slider { flex: 1; -webkit-appearance: none; appearance: none; height: 9px; border-radius: 5px;
  background: linear-gradient(90deg, rgba(94,200,255,.55), rgba(167,139,255,.45)); outline: none; cursor: pointer; }
.alloc-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 35% 32%, #d7efff, #5ec8ff); border: 2px solid #eaf6ff;
  box-shadow: 0 0 12px rgba(94,200,255,.65); cursor: grab; }
.alloc-slider::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #5ec8ff; border: 2px solid #eaf6ff; cursor: grab; }
.alloc-row .val { min-width: 56px; text-align: center; font-size: 20px; font-weight: 800; color: var(--gold); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: none; border-radius: 0; padding: 5px 12px; background: rgba(94,200,255,.10); font-size: 15px; }
.stepper .sval { min-width: 44px; text-align: center; font-size: 16px; font-weight: 800; color: var(--gold); }

/* ================= 角色图鉴 / 选人详情 ================= */
.roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.roster-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; background: var(--bg-panel-2); }
.roster-item .ri-head { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
.roster-item .ri-tier { margin-left: auto; }
.roster-item .ri-stats { font-size: 13px; color: var(--text-dim); margin: 4px 0 8px; display: flex; gap: 16px; }
.roster-item .ri-stats b { color: var(--gold); }
.roster-item .ri-skills { font-size: 13px; line-height: 1.7; color: var(--text); }
.roster-item .ri-skills b { color: var(--accent-2); }
.roster-item .ri-skills .meta { color: var(--gold); font-size: 12px; }
.char-detail { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; min-height: 24px; font-size: 14.5px; line-height: 1.7; }
.char-detail .cd-name { font-size: 19px; font-weight: 800; }
.char-detail .cd-stats { color: var(--text-dim); font-size: 12.5px; margin: 2px 0 8px; }
.char-detail .cd-skill b { color: var(--accent-2); }
.char-detail .cd-skill .meta { color: var(--gold); font-size: 12px; }
.cc-skills { margin-top: 7px; font-size: 13px; color: var(--accent-2); line-height: 1.45; }
select {
  font-family: inherit; background: var(--bg-panel-2); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; max-width: 170px;
}
.skill-list { display: flex; flex-direction: column; gap: 8px; }
.skill-item {
  display: flex; gap: 10px; align-items: flex-start; background: var(--bg-panel-2);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
.skill-item.on { border-color: var(--accent-2); box-shadow: 0 0 10px rgba(167,139,255,.25); }
.skill-item.off { opacity: .45; }
.skill-item .si-main { flex: 1; }
.skill-item .si-name { font-weight: 700; font-size: 15px; }
.skill-item .si-meta { font-size: 11.5px; color: var(--text-dim); margin: 2px 0 4px; }
.skill-item .si-meta .cost { color: var(--gold); }
.skill-item .si-meta .cd { color: var(--red); }
.skill-item .si-desc { font-size: 13px; color: var(--text-dim); line-height: 1.55; }
.form-choice { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.form-choice button { padding: 6px 12px; font-size: 12px; }
.form-choice button.on { border-color: var(--gold); color: var(--gold); }
.plan-actions { display: flex; justify-content: space-between; margin-top: 16px; }
.plan-unit-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
.plan-unit-tabs .tab {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; cursor: pointer;
}
.plan-unit-tabs .tab.on { border-color: var(--gold); color: var(--gold); }
.plan-unit-tabs .tab.done::after { content: " ✓"; color: var(--green); }

/* ================= 结算报告屏 ================= */
.report-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.report-log { max-height: 56vh; overflow-y: auto; padding-right: 6px; }
.report-phase { margin: 14px 0 6px; font-size: 13px; color: var(--accent); letter-spacing: .15em; border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
.ev { font-size: 14px; padding: 4px 8px; border-left: 2px solid transparent; color: var(--text); line-height: 1.6; }
.ev b { color: var(--text); }
.ev .dmg { color: var(--red); font-weight: 700; }
.ev .heal { color: var(--green); font-weight: 700; }
.ev .skillname { color: var(--accent-2); font-weight: 700; }
.ev .death { color: var(--red); font-weight: 700; text-shadow: 0 0 8px rgba(255,107,122,.4); }
.ev .gold { color: var(--gold); }
.ev-key { border-left-color: var(--gold); background: rgba(255,215,110,.05); }
.ev-dmg { border-left-color: var(--red); background: rgba(255,107,122,.06); }
.ev-death { border-left-color: var(--red); background: rgba(255,107,122,.10); }
.ev-skill { border-left-color: var(--accent-2); background: rgba(167,139,255,.07); }
.ev-gold { border-left-color: var(--gold); }
.hint-line { font-size: 12px; color: var(--text-dim); margin-top: 8px; line-height: 1.6; }
.pt-num.warn { color: var(--red); }

/* ================= 结束屏 / 帮助屏 ================= */
#screen-end { text-align: center; padding-top: 14vh; }
.end-big { font-size: 42px; margin: 24px 0; }
.help-box { line-height: 1.8; font-size: 14px; }
.help-box h3 { color: var(--gold); margin: 18px 0 8px; }
.help-box table { border-collapse: collapse; margin: 8px 0; }
.help-box td, .help-box th { border: 1px solid var(--line); padding: 5px 14px; font-size: 13px; }
.triangle-diagram { display: flex; align-items: center; justify-content: center; gap: 26px; margin: 14px 0; font-size: 15px; }
.triangle-diagram .node { border: 1px solid var(--line); border-radius: 10px; padding: 10px 18px; background: var(--bg-panel-2); }
.triangle-diagram .arrow { color: var(--gold); font-size: 20px; }
.triangle-diagram .node.win { border-color: var(--green); color: var(--green); }
.triangle-diagram .node.lose { border-color: var(--red); color: var(--red); }

/* ================= 测试页 ================= */
#test-root { font-family: Consolas, monospace; padding: 20px; }
#test-root h1 { font-size: 22px; margin-bottom: 8px; }
#test-root .summary { font-size: 15px; margin-bottom: 16px; }
#test-root .case { padding: 4px 10px; border-left: 3px solid var(--line); margin-bottom: 3px; font-size: 13px; }
#test-root .case.pass { border-color: var(--green); color: var(--green); }
#test-root .case.fail { border-color: var(--red); color: var(--red); white-space: pre-wrap; }
#test-root .case .err { color: var(--red); margin-left: 12px; }

/* AI 思考浮层 */
.ai-thinking {
  position: fixed; inset: 0; background: rgba(4, 6, 14, .78); z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
}
.ai-spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(94,200,255,.2); border-top-color: var(--accent); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= 通用弹窗 ================= */
.modal-mask { position: fixed; inset: 0; background: rgba(4,6,14,.72); z-index: 60; display: flex; align-items: center; justify-content: center; }
.modal-box { width: 480px; max-width: 90vw; background: linear-gradient(180deg, rgba(30,42,74,.98), rgba(19,27,50,.98));
  border: 1px solid var(--accent); border-radius: 14px; padding: 22px 26px; box-shadow: 0 10px 44px rgba(0,0,0,.65); }
.modal-title { font-size: 19px; font-weight: 800; color: var(--gold); margin-bottom: 12px; }
.modal-body { font-size: 15.5px; line-height: 1.9; color: var(--text); margin-bottom: 20px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
.modal-actions button { font-size: 15px; padding: 10px 24px; }

/* ================= 攻击目标（独立醒目行） ================= */
.target-select { flex: 1; width: 100%; max-width: none; font-size: 14.5px; padding: 9px 10px; }
.target-select.need { border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,110,.35); }
.target-fixed { flex: 1; font-size: 14px; color: var(--gold); background: rgba(255,215,110,.08);
  border: 1px solid rgba(255,215,110,.3); border-radius: 8px; padding: 8px 12px; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 标题/模式屏 ===== -->
  <section id="screen-title" class="screen active">
    <h1 class="game-title">星际争霸 <span class="t3">III</span></h1>
    <p class="subtitle">回 合 制 博 弈 · 同 人 二 创</p>
    <div class="mode-row" id="mode-row">
      <button class="mode-btn selected" data-mode="1v1">1v1</button>
      <button class="mode-btn" data-mode="2v2">2v2</button>
      <button class="mode-btn" data-mode="3v3">3v3</button>
    </div>
    <div class="ai-options" id="ai-options">
      <label><input type="checkbox" id="ai-enabled"> 玩家2 = AI 对手</label>
      <div class="difficulty-row">
        <label><input type="radio" name="ai-diff" value="easy"> 简单</label>
        <label><input type="radio" name="ai-diff" value="normal" checked> 普通</label>
        <label><input type="radio" name="ai-diff" value="hard"> 困难</label>
      </div>
    </div>
    <div class="title-actions">
      <button class="primary" id="btn-start">开始游戏</button>
      <button class="ghost" id="btn-roster">角色图鉴</button>
      <button class="ghost" id="btn-help">规则速查</button>
    </div>
    <p class="footnote">本作品为星际争霸主题同人二创 · 纯本地运行 · 无任何外部依赖 · <b id="ver-tag">v1.4</b></p>
  </section>

  <!-- ===== 角色选择屏 ===== -->
  <section id="screen-select" class="screen">
    <h2>角色选择</h2>
    <p class="select-hint" id="select-hint"></p>
    <div class="panel">
      <div class="char-grid" id="char-grid"></div>
      <div class="char-detail" id="char-detail"></div>
      <div class="lineup-strip" id="lineup-strip"></div>
      <div class="select-actions">
        <button class="ghost" id="btn-select-back">返回</button>
        <button class="primary" id="btn-select-confirm" disabled>确认阵容</button>
      </div>
    </div>
  </section>

  <!-- ===== 复制目标选择屏 ===== -->
  <section id="screen-copy" class="screen">
    <h2>复制目标选择</h2>
    <p class="select-hint" id="copy-hint"></p>
    <div class="panel" id="copy-panel"></div>
  </section>

  <!-- ===== 交接屏 ===== -->
  <section id="screen-handoff" class="screen">
    <h2>行动保密</h2>
    <div class="handoff-big" id="handoff-text"></div>
