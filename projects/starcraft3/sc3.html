<!-- ============================================================
     ENGINE 层：纯函数结算引擎（禁止触碰 DOM/document/window）
     API：createGame / beginRound / resolveRound / playRound / validatePlan
============================================================ -->
<script data-layer="ENGINE">
'use strict';

const MAX_ROUNDS = 100; // 回合上限：到顶判平局（防无限对拖延）

/* ---------- 工具 ---------- */
function cloneState(state, liteHistory = false) {
  return {
    mode: state.mode,
    round: state.round,
    winner: state.winner,
    maxRounds: state.maxRounds,
    aiPlayer: state.aiPlayer || null,
    teams: {
      A: state.teams.A.map(cloneUnit),
      B: state.teams.B.map(cloneUnit),
    },
    history: liteHistory ? [] : state.history.map(h => ({
      round: h.round,
      actions: Object.fromEntries(Object.entries(h.actions).map(([uid, a]) => [uid, {
        attack: a.attack ? { ...a.attack } : null,
        defend: a.defend, save: a.save,
        skills: (a.skills || []).map(s => ({ ...s })),
      }])),
    })),
  };
}

function cloneUnit(u) {
  return {
    uid: u.uid, charId: u.charId, copiedFrom: u.copiedFrom || null,
    name: u.name, icon: u.icon, team: u.team, slot: u.slot,
    hp: u.hp, maxHp: u.maxHp, atk: u.atk, income: u.income,
    available: u.available, bank: u.bank,
    cooldowns: { ...u.cooldowns },
    form: u.form, formKey: u.formKey || null,
    skills: u.skills.slice(),
    soulMarks: u.soulMarks,
    lastSave: u.lastSave,
    unbrokenUsed: !!u.unbrokenUsed,
    brokenDone: !!u.brokenDone,   // 已被势如破竹作用过
    stance: u.stance || null,     // 聚合姿态（常驻）
    alive: u.alive,
    roundFlags: cloneFlags(u.roundFlags),
  };
}

function cloneFlags(f) {
  return {
    bound: false, empd: false, corrodeLayers: 0, blazeLayers: 0,
    atkMod: 0, shield: 0, dodging: false, pierced: false,
    aggAtk: false, aggDef: false,
    insight: null,            // { a, b, targetUid }
    damageTaken: 0,
    soulGainMark: false,
    defPool: 0,               // 本回合防御池（S2 消耗用）
    grantedDef: 0,            // 聚合防御等外部赠予防御
    selfdestruct: false,
  };
}

function allUnits(state) { return [...state.teams.A, ...state.teams.B]; }
function aliveUnits(state) { return allUnits(state).filter(u => u.alive); }
function enemiesOf(state, unit) {
  return state.teams[unit.team === 'A' ? 'B' : 'A'];
}
function unitByUid(state, uid) {
  for (const u of allUnits(state)) if (u.uid === uid) return u;
  return null;
}
function hasSkill(unit, skillId) { return unit.skills.includes(skillId); }

/* 单位是否免疫其他单位技能（断牙狂暴 / 复制了断牙者） */
function isSkillImmune(victim, srcUnit) {
  if (!srcUnit || srcUnit.uid === victim.uid) return false; // 自己的技能对自己有效
  return hasSkill(victim, 'berserk');
}

/* ---------- 创建对局 ---------- */
function makeUnit(charId, team, slot) {
  const c = CHARACTERS[charId];
  if (!c) throw new Error('未知角色: ' + charId);
  const formKey = c.formKey || null;
  const initialForm = formKey ? FORM_DEFS[formKey].initial : null;
  const formStats = formKey && FORM_DEFS[formKey].stats && initialForm
    ? FORM_DEFS[formKey].stats[initialForm] : null;
  return {
    uid: team + slot,
    charId, copiedFrom: null,
    name: c.name, icon: c.icon, team, slot,
    hp: formStats ? formStats.hp : c.hp,
    maxHp: formStats ? formStats.hp : c.hp,
    atk: formStats ? formStats.atk : c.atk,
    income: formStats ? formStats.income : c.income,
    available: 0, bank: 0,
    cooldowns: {},
    form: initialForm, formKey,
    skills: c.skills.slice(),
    soulMarks: 0, lastSave: 0,
    unbrokenUsed: false, brokenDone: false,
    stance: null, // 聚合姿态（常驻，跨回合持久）：'aggAtk' | 'aggDef' | null
    alive: true,
    roundFlags: cloneFlags(null),
  };
}

/**
 * createGame(mode, teamACharIds, teamBCharIds, opts?)
 * opts.replicas: [{ unit: 'A0', target: 'B0' }] —— 复制者开局复制（战斗开始前公开选择）
 */
function createGame(mode, teamACharIds, teamBCharIds, opts = {}) {
  const n = MODE_UNIT_COUNT[mode];
  if (!n) throw new Error('未知模式: ' + mode);
  if (!Array.isArray(teamACharIds) || teamACharIds.length !== n) throw new Error('A 队角色数量错误');
  if (!Array.isArray(teamBCharIds) || teamBCharIds.length !== n) throw new Error('B 队角色数量错误');
  if (new Set(teamACharIds).size !== n) throw new Error('同队不可选择重复角色（A 队）');
  if (new Set(teamBCharIds).size !== n) throw new Error('同队不可选择重复角色（B 队）');

  const state = {
    mode, round: 0, winner: null, maxRounds: MAX_ROUNDS,
    aiPlayer: opts.aiPlayer || null,
    teams: {
      A: teamACharIds.map((id, i) => makeUnit(id, 'A', i)),
      B: teamBCharIds.map((id, i) => makeUnit(id, 'B', i)),
    },
    history: [],
  };

  // 复制者开局复制
  const replicas = opts.replicas || [];
  const replicators = allUnits(state).filter(u => u.charId === 'H10');
  for (const rep of replicators) {
    const choice = replicas.find(r => r.unit === rep.uid);
    if (!choice) throw new Error('复制者 ' + rep.uid + ' 缺少复制目标');
    const target = unitByUid(state, choice.target);
    if (!target) throw new Error('复制目标不存在: ' + choice.target);
    if (target.charId === 'H10') throw new Error('复制者不能复制复制者');
    applyReplica(rep, target);
  }
  return state;
}

/* 复制：当前形态属性 + 全部技能（不含复制）+ 保留自爆 */
function applyReplica(rep, target) {
  rep.copiedFrom = target.charId;
  rep.name = '复制·' + target.name;
  rep.atk = target.atk;
  rep.maxHp = target.maxHp;
  rep.hp = target.maxHp;           // 初始 HP = 目标当前上限
  rep.income = target.income;
  rep.form = target.form;
  rep.formKey = target.formKey;
  rep.skills = target.skills.filter(s => s !== 'copy').concat(['selfdestruct']);
}

/* ---------- 规划校验（完整版；只校验实际提交的单位条目） ---------- */
function validatePlan(state, playerId, plan) {
  const errors = [];
  const own = state.teams[playerId] || [];
  const planned = new Set(Object.keys(plan));

  for (const unit of own) {
    if (!unit.alive) {
      if (planned.has(unit.uid)) errors.push(`死亡单位 ${unit.name} 不可规划`);
      continue;
    }
    // 未提交条目的存活单位不在本次校验范围（空计划合法，由调用方保证全员提交）
    const p = plan[unit.uid];
    if (!p || typeof p !== 'object') continue;
    let spent = 0;

    // 攻击（points ≤ 0 视为未宣告）
    if (p.attack && p.attack.points > 0) {
      const t = unitByUid(state, p.attack.targetUid);
      if (!t || !t.alive || t.team === unit.team) errors.push(`${unit.name}: 攻击目标非法`);
      spent += p.attack.points;
    }
    // 防御 / 存入
    spent += p.defend || 0;
    spent += p.save || 0;

    // 阿拉纳克形态每回合必选（⚑R17）
    if (unit.formKey === 'alarak' && !['ad', 'ds', 'as'].includes(p.formChoice)) {
      errors.push(`${unit.name}: 阿拉纳克必须选择本回合形态`);
    }

    // 技能
    const skills = p.skills || [];
    for (const sk of skills) {
      const def = SKILLS[sk.id];
      if (!def) { errors.push(`${unit.name}: 未知技能 ${sk.id}`); continue; }
      if (!unit.skills.includes(sk.id)) { errors.push(`${unit.name} 不具备技能 ${def.name}`); continue; }
      if (def.type === 'passive' || def.type === 'special') { errors.push(`${def.name} 为被动/特殊技能，无需宣告`); continue; }
      if ((unit.cooldowns[sk.id] || 0) > 0) { errors.push(`${def.name} 冷却中（剩 ${unit.cooldowns[sk.id]} 回合）`); continue; }
      const count = sk.count || 1;
      if (count < 1) errors.push(`${def.name} 层数非法`);
      if (sk.id === 'sticky' && count > 1) errors.push(`${def.name} 不可同回合叠加`);
      if (sk.id === 'trinity' && !['atk', 'def', 'sav'].includes(sk.form || '')) errors.push(`${unit.name}: 三态需选择形态`);
      if (sk.id === 'insight' && (!['atk', 'def', 'save'].includes(sk.a) || !['atk', 'def', 'save'].includes(sk.b))) {
        errors.push(`${unit.name}: 识破需宣告 (A,B) 类型`);
      }
      spent += def.cost * count;
      if (def.target === 'enemy') {
        const t = sk.targetUid ? unitByUid(state, sk.targetUid) : null;
        if (!t || !t.alive || t.team === unit.team) { errors.push(`${def.name} 目标非法`); continue; }
      }
    }

    // 聚合姿态（常驻，跨回合持久）：仅聚合系角色可设置
    if (p.aggStance !== undefined && p.aggStance !== null) {
      if (!['aggAtk', 'aggDef'].includes(p.aggStance)) errors.push(`${unit.name}: 非法聚合姿态`);
      else if (!unit.skills.includes('aggAtk') && !unit.skills.includes('aggDef')) errors.push(`${unit.name}: 不具备聚合技能，无法设置姿态`);
    }

    if (spent > unit.available) {
      errors.push(`${unit.name}: 总支出 ${spent} 超过可用 ${unit.available}`);
    }
    if ((p.defend || 0) < 0 || (p.save || 0) < 0 || (p.attack && p.attack.points < 0)) {
      errors.push(`${unit.name}: 分配不可为负`);
    }
  }
  return { ok: errors.length === 0, errors };
}

/* ---------- 回合时间线（严格按规格 §4：R1 → S1 → S2 → S3 → S4 → S5） ---------- */

function emptyPlan(uid) {
  return { unitUid: uid, formChoice: undefined, attack: null, defend: 0, save: 0, skills: [] };
}

/* plans 允许 { uid: plan } 或 Plan 数组，统一为 { uid: plan } */
function normalizePlans(plans) {
  const out = {};
  if (!plans) return out;
  if (Array.isArray(plans)) {
    for (const p of plans) if (p && p.unitUid) out[p.unitUid] = { ...emptyPlan(p.unitUid), ...p };
  } else {
    for (const uid of Object.keys(plans)) {
      const p = plans[uid];
      if (p && typeof p === 'object') out[uid] = { ...emptyPlan(uid), ...p, unitUid: uid };
    }
  }
  return out;
}

/* ⚑R4 全局结算顺序：队伍 A→B、槽位升序 */
function orderedUnits(s) { return [...s.teams.A, ...s.teams.B]; }
function teamSlotKey(uid) { return (uid[0] === 'A' ? 0 : 10) + Number(uid.slice(1)); }

function ev(phase, type, src, dst, text, values, hl) {
  return { phase, type, src: src || null, dst: dst || null, text, values: values || {}, hl: hl || null };
}
function unitLabel(u) { return `${u.icon}${u.name}（${u.team}${u.slot}）`; }

/* ---------- R1 回合开始阶段 ---------- */
function beginRound(state, opts = {}) {
  const s = cloneState(state);
  const events = [];
  const silent = !!opts.silent;
  s.round += 1;

  // R1.1 所有单位冷却 −1，减到 0 的技能恢复可用
  for (const u of allUnits(s)) {
    for (const k of Object.keys(u.cooldowns)) {
      if (u.cooldowns[k] > 0) u.cooldowns[k] -= 1;
    }
  }

  // R1.2 收入：available += income；存入余额并入后清零
  for (const u of orderedUnits(s)) {
    if (!u.alive) continue;
    const inc = u.income, carry = u.bank;
    u.available += inc + carry;
    u.bank = 0;
    if (!silent) events.push(ev('R1', 'income', null, u.uid,
      `${unitLabel(u)} 获得收入 ${inc}${carry ? `，存入结转 ${carry}` : ''} → 可用 ${u.available}`,
      { income: inc, carry, available: u.available }, 'gold'));
  }

  // R1.3 被动触发（固定顺序：再生 → 生生不息 → 堕落 → 噬灵结算；M2 实装）
  runR1Passives(s, events, opts);

  return { state: s, events };
}

/* ---------- R3 结算阶段 ---------- */
function resolveRound(state, plans, opts = {}) {
  const s = cloneState(state);
  const events = [];
  const silent = !!opts.silent;
  const P = normalizePlans(plans);
  const starters = orderedUnits(s).filter(u => u.alive);

  // 各单位本回合分配上下文（S1 层会修正有效值；roundFlags 重建）
  const eff = {}; // uid -> { atk, def, save, power, skillCost, declared, saveMult, saveGift, refund, effSave, plan }
  for (const u of starters) {
    const p = P[u.uid] || emptyPlan(u.uid);
    const rawAtk = p.attack && p.attack.points > 0 ? p.attack.points : 0;
    const rawDef = p.defend || 0;
    const rawSave = p.save || 0;
    const skillCost = (p.skills || []).reduce((a, sk) => {
      const d = SKILLS[sk.id];
      return a + (d && d.cost ? d.cost * (sk.count || 1) : 0);
    }, 0);
    eff[u.uid] = {
      atk: rawAtk, def: rawDef, save: rawSave,
      power: u.atk,
      skillCost, declared: rawAtk + rawDef + rawSave + skillCost,
      saveMult: 1, saveGift: 0, refund: 0, effSave: 0,
      plan: p,
    };
    u.roundFlags = cloneFlags(null);
  }

  // ---- S1 技能控制与修正层（战斗前生效；M2 实装各技能） ----
  runS1(s, P, eff, events, opts);

  // ---- S2 战斗层 ----
  // S2 前置：防御池 = 有效防御 + 获赠防御；有效存入 = 存入 × 形态/被动倍率 + 联动赠予（S2 时计入，见 S5.4）
  for (const u of starters) {
    const e = eff[u.uid];
    u.roundFlags.defPool = e.def + u.roundFlags.grantedDef;
    e.effSave = e.save * e.saveMult * (hasSkill(u, 'production') ? 2 : 1) + e.saveGift;
  }

  // 2.1 生成攻击事件列表
  const attacks = [];
  for (const u of starters) {
    const e = eff[u.uid];
    const targetUid = e.plan.attack && e.atk > 0 ? e.plan.attack.targetUid : null;
    if (targetUid) attacks.push({ srcUid: u.uid, targetUid, points: e.atk, power: e.power });
  }
  // ⚑R1：攻点从大到小，相同按 (队伍, 槽位) 升序
  attacks.sort((a, b) => b.points - a.points || teamSlotKey(a.srcUid) - teamSlotKey(b.srcUid));

  // 2.2 逐条结算（同时性 ⚑R2：死亡只在 S4 判定，结算途中 HP 可为负、宣告照常结算）
  for (const atk of attacks) {
    const src = unitByUid(s, atk.srcUid);
    const victims = computeTargetSet(s, atk);
    const declaredTarget = unitByUid(s, atk.targetUid);
    let mainDmg = 0, anyEnemyDmg = false;
    for (const v of victims) {
      if (v.roundFlags.dodging) {
        if (!silent) events.push(ev('S2', 'dodge', atk.srcUid, v.uid,
          `${unitLabel(v)} 处于闪避状态，免疫该攻击`, {}, 'skill'));
        if (v === declaredTarget) mainDmg = 0;
        continue;
      }
      let pts = atk.points;
      let countered = false;
      // 萨尔纳加伏击者反制（⚑R8）：仅声明目标判定（实现裁定）
      if (v === declaredTarget && hasSkill(v, 'counter') && eff[v.uid].atk > pts) {
        pts = 0;
        countered = true;
      }
      // 星灵光刃：泽拉图攻点 > 受击者有效防点 → 该受击者防点对本攻击无效
      let defIgnored = false;
      if (src && hasSkill(src, 'lightblade') && pts > eff[v.uid].def) defIgnored = true;
      // 穿甲弹标记
      if (v.roundFlags.pierced) defIgnored = true;
      const actualDef = defIgnored ? 0 : Math.min(v.roundFlags.defPool, pts);
      if (!defIgnored) v.roundFlags.defPool -= actualDef;   // 防御被消耗不返还
      let dmg = Math.max(0, (pts - actualDef) * atk.power);
      const baseDmg = dmg;
      if (dmg > 0 && v.roundFlags.blazeLayers > 0) dmg *= Math.pow(2, v.roundFlags.blazeLayers); // 烈焰 ×2^L
      let shieldAbs = 0;
      if (dmg > 0 && v.roundFlags.shield > 0) {
        shieldAbs = Math.min(v.roundFlags.shield, dmg);
        v.roundFlags.shield -= shieldAbs;
        dmg -= shieldAbs;
      }
      if (dmg > 0) { v.hp -= dmg; v.roundFlags.damageTaken += dmg; }
      if (!silent) events.push(ev('S2', 'attack', atk.srcUid, v.uid,
        `${unitLabel(src)} 攻击 ${unitLabel(v)}：攻 ${pts}${countered ? '（反制归零）' : ''}${actualDef ? ` − 防 ${actualDef}` : (defIgnored ? '（防无效）' : '')} × 攻击力 ${atk.power} → 伤害 ${dmg}${shieldAbs ? `（盾吸收 ${shieldAbs}）` : ''}`,
        { points: pts, def: actualDef, power: atk.power, dmg, shieldAbs, countered }, dmg > 0 ? 'damage' : null));
      if (v === declaredTarget) mainDmg = dmg;
      if (dmg > 0 && v.team !== src.team) anyEnemyDmg = true;
    }
    // S2.c 连锁电击（奥丁攻击被动，⚑R9）：目标集之外其他存活敌方受 floor(主目标伤害/2) 溅射
    if (src && hasSkill(src, 'chain') && mainDmg > 0) {
      const splash = Math.floor(mainDmg / 2);
      const inSet = new Set(victims.map(v => v.uid));
      for (const v of aliveUnits(s)) {
        if (v.team === src.team || inSet.has(v.uid)) continue;
        if (isSkillImmune(v, src)) {
          if (!silent) events.push(ev('S2', 'immune', atk.srcUid, v.uid, `${unitLabel(v)} 狂暴：免疫连锁电击溅射`, {}, 'skill'));
          continue;
        }
        let d = splash * Math.pow(2, v.roundFlags.blazeLayers); // 溅射吃烈焰倍率（不叠加）
        let shieldAbs = 0;
        if (d > 0 && v.roundFlags.shield > 0) {
          shieldAbs = Math.min(v.roundFlags.shield, d);
          v.roundFlags.shield -= shieldAbs;
          d -= shieldAbs;
        }
        if (d > 0) { v.hp -= d; v.roundFlags.damageTaken += d; }
        if (!silent) events.push(ev('S2', 'splash', atk.srcUid, v.uid,
          `${unitLabel(v)} 受连锁电击溅射 ${d}${shieldAbs ? `（盾吸收 ${shieldAbs}）` : ''}（不吃防御）`, { splash: d, shieldAbs }, d > 0 ? 'damage' : null));
      }
    }
    // S2.d 自爆反噬（⚑R10）：复制者受到主目标所受的等量伤害（无视防御与盾）
    if (src && src.roundFlags.selfdestruct && mainDmg > 0) {
      src.hp -= mainDmg;
      src.roundFlags.damageTaken += mainDmg;
      if (!silent) events.push(ev('S2', 'recoil', atk.srcUid, atk.srcUid,
        `${unitLabel(src)} 自爆反噬：受到等量伤害 ${mainDmg}（无视防御与盾）`, { recoil: mainDmg }, 'damage'));
    }
    // S2.e 噬灵标记（裁定：需场上存活噬灵来源；狂暴单位不获得）
    if (anyEnemyDmg) {
      const soulSrc = aliveUnits(s).find(u => hasSkill(u, 'soul'));
      if (soulSrc && !isSkillImmune(src, soulSrc) && !src.roundFlags.soulGainMark) {
        src.roundFlags.soulGainMark = true;
      }
    }
  }

  // ---- S3 直接伤害技能层（M2 实装：处决 ⚑R11） ----
  runS3(s, P, eff, events, opts);

  // ---- S4 死亡清算 ----
  for (const u of orderedUnits(s)) {
    if (u.alive && u.hp <= 0) {
      // 埃蒙不屈：每场限一次，死亡时改为存活、HP=60、回形态一
      if (hasSkill(u, 'unbroken') && !u.unbrokenUsed) {
        u.unbrokenUsed = true;
        setFormStats(u, 'f1');
        u.hp = 60;
        if (!silent) events.push(ev('S4', 'unbroken', null, u.uid,
          `${unitLabel(u)} 发动【不屈】：改为存活、HP 60、回形态一（每场限一次）`, {}, 'skill'));
      } else {
        u.alive = false;
        if (!silent) events.push(ev('S4', 'death', null, u.uid,
          `${unitLabel(u)} 阵亡`, { hp: u.hp }, 'death'));
      }
    }
  }

  // ---- S5 回合结束层 ----
  runS5(s, P, eff, events, opts);          // 5.1–5.3：凯瑞甘大招 / 德哈卡形态 / 噬灵入账（M2）
  for (const u of allUnits(s)) {           // 5.4 效果清理
    u.roundFlags = cloneFlags(null);
  }
  for (const u of orderedUnits(s)) {       // 5.5 存入余额 = 有效存入量 + 退化返还；available 清零（未花未存直接损失）
    const e = eff[u.uid];
    if (u.alive && e) {
      u.bank = (e.effSave || 0) + (e.refund || 0);
      const wasted = u.available - e.declared;
      if (!silent && u.bank > 0) events.push(ev('S5', 'save', null, u.uid,
        `${unitLabel(u)} 存入 ${u.bank} 点至下回合`, { save: u.bank }, 'gold'));
      if (!silent && wasted > 0) events.push(ev('S5', 'waste', null, u.uid,
        `${unitLabel(u)} 损失未使用点数 ${wasted}`, { wasted }));
    } else {
      u.bank = 0; // 死亡单位当回合存入作废
    }
    u.available = 0;
    const p = P[u.uid];
    if (p) u.lastSave = p.save || 0;
  }

  // 5.6 胜负判定
  const aAlive = s.teams.A.some(u => u.alive);
  const bAlive = s.teams.B.some(u => u.alive);
  if (!aAlive && !bAlive) s.winner = 'draw';
  else if (!aAlive) s.winner = 'B';
  else if (!bAlive) s.winner = 'A';
  else if (s.round >= s.maxRounds) s.winner = 'draw';
  if (s.winner && !silent) events.push(ev('S5', 'winner', null, null,
    s.winner === 'draw' ? '双方同时全灭 → 平局' : `${s.winner === 'A' ? 'A 队' : 'B 队'} 获胜！`,
    { winner: s.winner }, 'gold'));

  // history：已揭示实际行动记录（§13.2，供战斗报告与 AI 建模）
  const actions = {};
  for (const u of starters) {
    const p = P[u.uid];
    if (!p) continue;
    actions[u.uid] = {
      attack: p.attack && p.attack.points > 0 ? { points: p.attack.points, target: p.attack.targetUid } : null,
      defend: p.defend || 0,
      save: p.save || 0,
      skills: (p.skills || []).map(sk => sk.id),
    };
  }
  s.history.push({ round: s.round, actions });

  return { state: s, events };
}

/* S2.a 目标集（⚑R19/⚑R13）：迷乱优先全场 → 聚合攻击全体敌方 → 声明目标 */
function computeTargetSet(s, atk) {
  const confusion = aliveUnits(s).some(u => hasSkill(u, 'confusion'));
  if (confusion) return aliveUnits(s);
  const src = unitByUid(s, atk.srcUid);
  if (src && src.stance === 'aggAtk' && hasSkill(src, 'aggAtk')) return aliveUnits(s).filter(u => u.team !== src.team);
  const t = unitByUid(s, atk.targetUid);
  return t && t.alive ? [t] : [];
}

function setFormStats(u, f) {
  const fd = FORM_DEFS[u.formKey];
  if (!fd || !fd.stats || !fd.stats[f]) return;
  const st = fd.stats[f];
  u.form = f;
  u.maxHp = st.hp;
  u.atk = st.atk;
  u.income = st.income;
}

/* ---------- R1.3 被动触发（固定顺序：再生 → 生生不息 → 堕落 → 噬灵结算） ---------- */
function runR1Passives(s, events, opts) {
  const silent = !!opts.silent;
  const starters = orderedUnits(s).filter(u => u.alive);
  // ① 凯瑞甘再生：+4 HP，不超过当前形态上限
  for (const u of starters) {
    if (!hasSkill(u, 'regen')) continue;
    const heal = Math.min(4, u.maxHp - u.hp);
    if (heal > 0) u.hp += heal;
    if (!silent && heal > 0) events.push(ev('R1', 'regen', null, u.uid,
      `${unitLabel(u)} 再生 +${heal}（HP ${u.hp}/${u.maxHp}）`, { heal }, 'skill'));
  }
  // ② 刺蛇生生不息（⚑R3）：floor(上回合宣告存入量 / 4)
  for (const u of starters) {
    if (!hasSkill(u, 'endless')) continue;
    const bonus = Math.floor((u.lastSave || 0) / 4);
    if (bonus > 0) {
      u.available += bonus;
      if (!silent) events.push(ev('R1', 'endless', null, u.uid,
        `${unitLabel(u)} 生生不息：额外获得 ${bonus} 点（上回合存入 ${u.lastSave}）`, { bonus }, 'gold'));
    }
  }
  // ③ 埃蒙堕落：−10 HP 后按新血量检查阶段跃迁（⚑R22：血量数值不变，仅切属性）
  for (const u of starters) {
    if (!hasSkill(u, 'degenerate')) continue;
    u.hp -= 10;
    if (!silent) events.push(ev('R1', 'degenerate', null, u.uid,
      `${unitLabel(u)} 堕落：−10 生命（HP ${u.hp}）`, { hp: u.hp }, 'skill'));
    const fd = FORM_DEFS[u.formKey];
    if (fd && fd.stats) {
      const target = u.hp <= 20 ? 'f3' : (u.hp <= 40 ? 'f2' : 'f1');
      if (target !== u.form) {
        setFormStats(u, target);
        if (!silent) events.push(ev('R1', 'phaseShift', null, u.uid,
          `${unitLabel(u)} 阶段跃迁 → ${fd.labels[target]}（攻 ${u.atk}/上限 ${u.maxHp}/收入 ${u.income}）`, { form: target }, 'skill'));
      }
    }
  }
  // ④ 噬灵结算：每层自动支付 2 点；付不起则失去 round(最大生命×25%)（四舍五入）；层数永不消失
  for (const u of starters) {
    const marks = u.soulMarks || 0;
    if (marks <= 0) continue;
    const total = marks * 2;
    if (u.available >= total) {
      u.available -= total;
      if (!silent) events.push(ev('R1', 'soulPay', null, u.uid,
        `${unitLabel(u)} 噬灵结算：支付 ${total} 点（${marks} 层 × 2）`, { pay: total }, 'skill'));
    } else {
      const loss = Math.round(u.maxHp * 0.25);
      u.hp -= loss;
      if (!silent) events.push(ev('R1', 'soulPenalty', null, u.uid,
        `${unitLabel(u)} 噬灵结算：点数不足，失去 ${loss} 生命（round(最大生命 ${u.maxHp} × 25%)）`, { loss }, 'skill'));
    }
  }
}

/* ---------- S1 技能控制与修正层（战斗前生效；⚑R4 单位顺序；先套形态再套 S1 修正） ---------- */
function runS1(s, P, eff, events, opts) {
  const silent = !!opts.silent;
  const starters = orderedUnits(s).filter(u => u.alive && eff[u.uid]);

  // PRE-STEP：形态效果（三位一体倍率 / 阿拉纳克联动 ⚑R17，先套形态再套 S1 修正）
  for (const u of starters) {
    const e = eff[u.uid];
    const triDecl = (e.plan.skills || []).find(sk => sk.id === 'trinity');
    const triForm = triDecl && triDecl.form ? triDecl.form : (u.formKey === 'trinity' ? u.form : null);
    if (u.formKey === 'trinity' && triForm) {
      if (triForm === 'atk') e.atk *= 2;
      else if (triForm === 'def') e.def *= 4;
      else if (triForm === 'sav') e.saveMult = 2;
    }
    if (u.formKey === 'alarak' && e.plan.formChoice) {
      const da = e.plan.attack && e.plan.attack.points > 0 ? e.plan.attack.points : 0;
      const dd = e.plan.defend || 0;
      const ds = e.plan.save || 0;
      const f = e.plan.formChoice;
      if (f === 'ad') { e.atk += dd; e.def += da; }
      else if (f === 'ds') { e.def += ds; e.saveGift += dd; }
      else if (f === 'as') { e.atk += ds; e.saveGift += da; }
    }
  }

  // 常驻机制 ①：聚合姿态更新（持久跨回合；plan.aggStance 未提供则维持原姿态）
  for (const u of starters) {
    const p = eff[u.uid].plan;
    if (p.aggStance !== undefined && hasSkill(u, 'aggAtk')) u.stance = p.aggStance;
  }
  // 常驻机制 ②（按 ⚑R4 单位顺序）：聚合防御自动赠予 / 势如破竹自动瓦解
  for (const u of starters) {
    const e = eff[u.uid];
    if (u.stance === 'aggDef' && hasSkill(u, 'aggDef')) {
      const grant = Math.floor(e.def / 2);
      for (const m of s.teams[u.team]) {
        if (m.uid === u.uid || !m.alive) continue;
        if (isSkillImmune(m, u)) {
          if (!silent) events.push(ev('S1', 'immune', u.uid, m.uid, `${unitLabel(m)} 狂暴：免疫【聚合防御】赠予`, {}, 'skill'));
          continue;
        }
        m.roundFlags.grantedDef += grant;
        if (!silent) events.push(ev('S1', 'aggDef', u.uid, m.uid,
          `${unitLabel(m)} 获得聚合防御 ${grant} 点（${unitLabel(u)} 防点 ${e.def} 的一半）`, { grant }, 'skill'));
      }
    }
    if (hasSkill(u, 'breakthrough')) {
      const cands = enemiesOf(s, u).filter(t => t.alive && !t.brokenDone && !isSkillImmune(t, u))
        .sort((a, b) => b.income - a.income || teamSlotKey(a.uid) - teamSlotKey(b.uid));
      if (cands.length) {
        const t = cands[0];
        t.brokenDone = true;
        t.income = Math.max(0, t.income - 2);
        if (!silent) events.push(ev('S1', 'breakthrough', u.uid, t.uid,
          `${unitLabel(u)} 【势如破竹】自动瓦解：${unitLabel(t)} 收入永久 −2（现 ${t.income}）`, { income: t.income }, 'skill'));
      }
    }
  }

  // 逐单位处理宣告技能；冷却统一登记（含被束缚/失效宣告，实现裁定：照进冷却）
  for (const u of starters) {
    const decls = eff[u.uid].plan.skills || [];
    for (const sk of decls) {
      const def = SKILLS[sk.id];
      if (def && def.cooldown > 0) u.cooldowns[sk.id] = def.cooldown + 1;
    }
    if (u.roundFlags.bound) {
      // 束缚在其目标之前结算 → 该单位全部主动技能失效（费用照扣 ⚑R5）
      for (const sk of decls) {
        const def = SKILLS[sk.id];
        if (def && !silent) events.push(ev('S1', 'skillFail', u.uid, null,
          `${unitLabel(u)} 被束缚：【${def.name}】失效（费用照扣不退还）`, { skill: sk.id }, 'skill'));
      }
      continue;
    }
    for (const sk of decls) resolveS1Skill(s, u, sk, eff, events, opts);
  }
}

function resolveS1Skill(s, u, sk, eff, events, opts) {
  const silent = !!opts.silent;
  const def = SKILLS[sk.id];
  if (!def) return;
  const E = eff[u.uid];
  const targetOf = () => sk.targetUid ? unitByUid(s, sk.targetUid) : null;
  const immuneSkip = (t, name) => {
    if (!isSkillImmune(t, u)) return false;
    if (!silent) events.push(ev('S1', 'immune', u.uid, t.uid,
      `${unitLabel(t)} 狂暴：免疫【${name}】`, {}, 'skill'));
    return true;
  };
  switch (sk.id) {
    case 'trinity': { // 形态切换（倍率已在 PRE-STEP 套用）
      if (!sk.form || !['atk', 'def', 'sav'].includes(sk.form)) return;
      u.form = sk.form;
      if (!silent) events.push(ev('S1', 'form', u.uid, u.uid,
        `${unitLabel(u)} 切换三态 → ${FORM_DEFS.trinity.labels[sk.form]}`, { form: sk.form }, 'skill'));
      return;
    }
    case 'insight': { // (A,B,目标)：己方 A 分配 > 目标 B 分配 → 目标 B 归零
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      const myVal = sk.a === 'atk' ? E.atk : (sk.a === 'def' ? E.def : E.save);
      const tvVal = sk.b === 'atk' ? eff[t.uid].atk : (sk.b === 'def' ? eff[t.uid].def : eff[t.uid].save);
      const abName = { atk: '攻', def: '防', save: '存' };
      if (myVal > tvVal) {
        eff[t.uid][sk.b] = 0;
        if (!silent) events.push(ev('S1', 'insight', u.uid, t.uid,
          `${unitLabel(u)} 【识破】生效（己方${abName[sk.a]} ${myVal} > 目标${abName[sk.b]} ${tvVal}）：${unitLabel(t)} 的${abName[sk.b]}分配归零`, { a: sk.a, b: sk.b }, 'skill'));
      } else if (!silent) {
        events.push(ev('S1', 'insightFail', u.uid, t.uid,
          `${unitLabel(u)} 【识破】未生效（己方${abName[sk.a]} ${myVal} ≤ 目标${abName[sk.b]} ${tvVal}）`, { a: sk.a, b: sk.b }, 'skill'));
      }
      return;
    }
    case 'dodge':
      u.roundFlags.dodging = true;
      if (!silent) events.push(ev('S1', 'dodge', u.uid, u.uid, `${unitLabel(u)} 进入闪避（本回合免疫攻击伤害）`, {}, 'skill'));
      return;
    case 'shieldField':
      u.roundFlags.shield += 20;
      if (!silent) events.push(ev('S1', 'shield', u.uid, u.uid, `${unitLabel(u)} 获得电磁场盾 20 点`, { shield: 20 }, 'skill'));
      return;
    case 'plasma':
      E.power += 3;
      if (!silent) events.push(ev('S1', 'plasma', u.uid, u.uid, `${unitLabel(u)} 电浆束：本回合攻击力 +3（现 ${E.power}）`, { power: E.power }, 'skill'));
      return;
    case 'paraRay': {
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      eff[t.uid].power = Math.max(0, eff[t.uid].power - 2);
      if (!silent) events.push(ev('S1', 'paraRay', u.uid, t.uid,
        `${unitLabel(t)} 被麻痹：攻击力 −2（现 ${eff[t.uid].power}）`, { power: eff[t.uid].power }, 'skill'));
      return;
    }
    case 'pierce': {
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      t.roundFlags.pierced = true;
      if (!silent) events.push(ev('S1', 'pierce', u.uid, t.uid, `${unitLabel(t)} 被穿甲：本回合防御无效`, {}, 'skill'));
      return;
    }
    case 'emp': { // ⚑R6：分配全无效，点数照扣
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      t.roundFlags.empd = true;
      eff[t.uid].atk = 0; eff[t.uid].def = 0; eff[t.uid].save = 0;
      if (!silent) events.push(ev('S1', 'emp', u.uid, t.uid,
        `${unitLabel(t)} 被 EMP：本回合攻/防/存分配全部无效（点数照扣）`, {}, 'skill'));
      return;
    }
    case 'corrode':
    case 'sticky': { // 分配各 ×50% 向下取整，每层减半一次
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      const layers = sk.id === 'sticky' ? 1 : (sk.count || 1);
      for (let i = 0; i < layers; i++) {
        eff[t.uid].atk = Math.floor(eff[t.uid].atk / 2);
        eff[t.uid].def = Math.floor(eff[t.uid].def / 2);
        eff[t.uid].save = Math.floor(eff[t.uid].save / 2);
      }
      if (!silent) events.push(ev('S1', 'corrode', u.uid, t.uid,
        `${unitLabel(t)} 被腐蚀 ${layers} 层：攻/防/存分配各减半（现 ${eff[t.uid].atk}/${eff[t.uid].def}/${eff[t.uid].save}）`, { layers }, 'skill'));
      return;
    }
    case 'blaze': {
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      t.roundFlags.blazeLayers += (sk.count || 1);
      if (!silent) events.push(ev('S1', 'blaze', u.uid, t.uid,
        `${unitLabel(t)} 被点燃 ${sk.count || 1} 层：受到的伤害 ×${Math.pow(2, t.roundFlags.blazeLayers)}`, { layers: t.roundFlags.blazeLayers }, 'skill'));
      return;
    }
    case 'bindRay': { // ⚑R5：主动技能失效，费用照扣；被动免疫
      const t = targetOf();
      if (!t) return;
      if (immuneSkip(t, def.name)) return;
      t.roundFlags.bound = true;
      if (!silent) events.push(ev('S1', 'bind', u.uid, t.uid,
        `${unitLabel(t)} 被束缚：本回合宣告的主动技能全部失效（费用照扣）`, {}, 'skill'));
      return;
    }
    case 'selfdestruct':
      E.atk *= 2; // ⚑R10：本回合攻点 ×2 用于伤害计算
      u.roundFlags.selfdestruct = true;
      if (!silent) events.push(ev('S1', 'selfdestruct', u.uid, u.uid, `${unitLabel(u)} 宣告【自爆】：攻点 ×2（现 ${E.atk}），主目标结算后受等量反噬`, {}, 'skill'));
      return;
    default:
      return; // S3/S5 层技能（处决/大招/形态）在对应层结算
  }
}

/* ---------- S3 直接伤害技能层：处决（⚑R11） ---------- */
function runS3(s, P, eff, events, opts) {
  const silent = !!opts.silent;
  for (const u of orderedUnits(s)) {
    if (!u.alive || !eff[u.uid]) continue;
    for (const sk of (eff[u.uid].plan.skills || [])) {
      if (sk.id !== 'execute') continue;
      const t = unitByUid(s, sk.targetUid);
      if (!t) continue;
      if (u.roundFlags.bound) continue; // 失效已在 S1 报告
      if (isSkillImmune(t, u)) {
        if (!silent) events.push(ev('S3', 'immune', u.uid, t.uid, `${unitLabel(t)} 狂暴：免疫【处决】`, {}, 'skill'));
        continue;
      }
      const loss = Math.round(t.maxHp * 0.5);
      t.hp -= loss;
      t.roundFlags.damageTaken += loss;
      if (!silent) events.push(ev('S3', 'execute', u.uid, t.uid,
        `${unitLabel(u)} 释放【处决】：${unitLabel(t)} 失去 ${loss} 生命（最大生命 ${t.maxHp} × 50%，不吃防御/盾）`, { loss }, 'damage'));
    }
  }
}

/* ---------- S5.1–5.3：凯瑞甘大招 / 德哈卡形态 / 噬灵入账 ---------- */
function runS5(s, P, eff, events, opts) {
  const silent = !!opts.silent;
  // 5.1 凯瑞甘大招（⚑R23：仅统计 S1–S4 伤害；⚑R2：宣告者死亡作废）
  for (const u of orderedUnits(s)) {
    if (!eff[u.uid]) continue;
    const decl = (eff[u.uid].plan.skills || []).find(sk => sk.id === 'ult');
    if (!decl || u.roundFlags.bound) continue;
    if (!u.alive) {
      if (!silent) events.push(ev('S5', 'ultVoid', null, u.uid,
        `${unitLabel(u)} 已阵亡，【致命突袭】作废（⚑R2）`, {}, 'skill'));
      continue;
    }
    if (u.roundFlags.damageTaken > 0) {
      if (!silent) events.push(ev('S5', 'ultFail', u.uid, null,
        `${unitLabel(u)} 的【致命突袭】落空：本回合已受到伤害（${u.roundFlags.damageTaken}）`, {}, 'skill'));
      continue;
    }
    const t = unitByUid(s, decl.targetUid);
    if (!t) continue;
    if (isSkillImmune(t, u)) {
      if (!silent) events.push(ev('S5', 'immune', u.uid, t.uid, `${unitLabel(t)} 狂暴：免疫【致命突袭】`, {}, 'skill'));
      continue;
    }
    t.hp -= 24;
    t.roundFlags.damageTaken += 24;
    if (!silent) events.push(ev('S5', 'ult', u.uid, t.uid,
      `${unitLabel(u)} 的【致命突袭】命中：${unitLabel(t)} 失去 24 生命（未受任何伤害，不吃防御/盾）`, { loss: 24 }, 'damage'));
  }
  // 5.2 德哈卡进化/超进化/退化（⚑R2：宣告者存活才生效；⚑R12 退化返还）
  for (const u of orderedUnits(s)) {
    const decls = eff[u.uid]
      ? (eff[u.uid].plan.skills || []).filter(sk => sk.id === 'evolve' || sk.id === 'superEvolve' || sk.id === 'devolve')
      : [];
    if (!decls.length) continue;
    if (!u.alive) {
      if (!silent) events.push(ev('S5', 'formFail', null, u.uid, `${unitLabel(u)} 已阵亡，形态技能作废`, {}, 'skill'));
      continue;
    }
    if (u.roundFlags.bound) continue; // 失效已在 S1 报告
    for (const sk of decls) {
      if (sk.id === 'evolve') {
        setFormStats(u, 'f2');
        u.hp = u.maxHp;
        if (!silent) events.push(ev('S5', 'evolve', null, u.uid,
          `${unitLabel(u)} 进化 → ${FORM_DEFS.dehaka.labels.f2}（血量重置 ${u.hp}/${u.maxHp}，攻 ${u.atk}，收入 ${u.income}）`, { form: 'f2' }, 'skill'));
      } else if (sk.id === 'superEvolve') {
        setFormStats(u, 'f3');
        u.hp = u.maxHp;
        if (!silent) events.push(ev('S5', 'evolve', null, u.uid,
          `${unitLabel(u)} 超进化 → ${FORM_DEFS.dehaka.labels.f3}（血量重置 ${u.hp}/${u.maxHp}，攻 ${u.atk}，收入 ${u.income}）`, { form: 'f3' }, 'skill'));
      } else if (sk.id === 'devolve') {
        const refund = u.form === 'f2' ? 6 : (u.form === 'f3' ? 12 : 0);
        setFormStats(u, 'f1');
        u.hp = Math.min(u.hp, u.maxHp); // 上限 20，血量截断
        eff[u.uid].refund += refund;
        if (!silent) events.push(ev('S5', 'devolve', null, u.uid,
          `${unitLabel(u)} 退化 → ${FORM_DEFS.dehaka.labels.f1}（血量截断 ${u.hp}/${u.maxHp}，返还 ${refund} 点入下回合池）`, { refund }, 'gold'));
      }
    }
  }
  // 5.3 噬灵入账（每回合至多 +1）
  for (const u of orderedUnits(s)) {
    if (u.roundFlags.soulGainMark) {
      u.roundFlags.soulGainMark = false;
      u.soulMarks += 1;
      if (!silent) events.push(ev('S5', 'soulGain', null, u.uid,
        `${unitLabel(u)} 获得 1 层噬灵（共 ${u.soulMarks} 层）`, { soulMarks: u.soulMarks }, 'skill'));
    }
  }
}

function playRound(state, plans, opts = {}) {
  const r1 = beginRound(state, opts);
  return resolveRound(r1.state, plans, opts);
}
</script>

<!-- ============================================================
     AI 层：纯函数规划器（M5 实装，禁止触碰 DOM/window）
============================================================ -->
<script data-layer="AI">
'use strict';
/* ================= AI 对手（§13，1v1 专属，纯函数，rng 可注入） ================= */

const AI_PARAMS = { // §13.6 参数表（最终裁定）
  easy:   { lambda: 0.5,  temperature: 0.35, noise: true,  counterShortcutChance: 0.30, historyBlend: 0   },
  normal: { lambda: 0.8,  temperature: 0.15, noise: false, counterShortcutChance: 0,    historyBlend: 0   },
  hard:   { lambda: 0.95, temperature: 0.05, noise: false, counterShortcutChance: 0,    historyBlend: 0.4 },
};

function planWithAI(state, difficulty, rng) {
  const side = state.aiPlayer || 'B';
  const params = AI_PARAMS[difficulty] || AI_PARAMS.normal;
  const enemySide = side === 'A' ? 'B' : 'A';
  const enemies = state.teams[enemySide].filter(u => u.alive);
  const plans = {};
  for (const unit of state.teams[side]) {
    if (!unit.alive) continue;
    const cands = aiPlanForUnit(state, unit, side, difficulty, params, rng);
    plans[unit.uid] = aiChoose(state, unit, side, enemies, cands, difficulty, params, rng);
  }
  return plans;
}

/* ---------- §13.2 感知：近 N 回合已揭示行动 ---------- */
function aiRecentActions(state, uid, n) {
  return state.history.slice(-n).map(h => h.actions[uid]).filter(Boolean);
}

/* ---------- §13.3 对手建模 q ---------- */
function aiOpponentQ(state, enemy, myUnits, mySide, difficulty, params, rng) {
  let wAtk = 1.0 + 0.15 * enemy.atk;
  let wSave = 1.0 + Math.max(0, 8 - enemy.income) * 0.3;
  let wDef = 0.8 + Math.max(0, enemy.income - 6) * 0.1;
  const usableSkills = enemy.skills.filter(id => {
    const d = SKILLS[id];
    return d && d.type === 'active' && !(enemy.cooldowns[id] > 0) && d.cost <= enemy.available;
  });
  let wSkill = usableSkills.length ? 1.2 : 0;

  // 处境乘子
  const aliveMine = myUnits.filter(u => u.alive);
  if (aliveMine.length) {
    const killPts = Math.min(...aliveMine.map(u => Math.ceil(u.hp / Math.max(1, enemy.atk))));
    if (enemy.available >= killPts) wAtk *= 3;
  }
  if (enemy.hp < enemy.maxHp * 0.35) { wDef *= 2.5; wAtk *= 0.6; }
  const lastRound = state.history[state.history.length - 1];
  const last = lastRound ? lastRound.actions[enemy.uid] : null;
  if (last && last.save >= 2 * enemy.income) wAtk *= 2;
  if (lastRound) {
    const attackedByMe = Object.entries(lastRound.actions).some(([uid, a]) =>
      uid[0] === mySide && a.attack && a.attack.target === enemy.uid);
    if (attackedByMe) wDef *= 1.8;
    if (last && last.attack) {
      const tgtActions = lastRound.actions[last.attack.target];
      if (tgtActions && (tgtActions.defend || 0) >= (last.attack.points || 0)) wAtk *= 0.7;
    }
  }
  if (usableSkills.length === enemy.skills.filter(id => SKILLS[id] && SKILLS[id].type === 'active').length && usableSkills.length) wSkill *= 1.5;

  let base = aiNormalize4({ atk: wAtk, def: wDef, save: wSave, skill: wSkill });
  if (params.noise) { // easy：分量 ×U(0.6,1.4) 后归一化
    base = aiNormalize4({
      atk: base.atk * (0.6 + 0.8 * rng()),
      def: base.def * (0.6 + 0.8 * rng()),
      save: base.save * (0.6 + 0.8 * rng()),
      skill: base.skill * (0.6 + 0.8 * rng()),
    });
  }
  if (params.historyBlend > 0) { // hard：0.6×q_base + 0.4×q_hist（样本 <2 退化为 q_base）
    const rec = aiRecentActions(state, enemy.uid, 3);
    if (rec.length >= 2) {
      const counts = { atk: 0, def: 0, save: 0, skill: 0 };
      for (const a of rec) {
        if (a.attack && a.attack.points > 0) counts.atk++;
        if ((a.defend || 0) > 0) counts.def++;
        if ((a.save || 0) > 0) counts.save++;
        if ((a.skills || []).length) counts.skill++;
      }
      const qh = aiNormalize4(counts);
      const b = params.historyBlend;
      base = aiNormalize4({
        atk: (1 - b) * base.atk + b * qh.atk,
        def: (1 - b) * base.def + b * qh.def,
        save: (1 - b) * base.save + b * qh.save,
        skill: (1 - b) * base.skill + b * qh.skill,
      });
    }
  }
  return base;
}

function aiNormalize4(q) {
  const t = q.atk + q.def + q.save + q.skill;
  if (!(t > 0)) return { atk: 0.25, def: 0.25, save: 0.25, skill: 0.25 };
  return { atk: q.atk / t, def: q.def / t, save: q.save / t, skill: q.skill / t };
}

/* ---------- §13.4 候选生成（≤15，去重 + 启发式剪枝） ---------- */
function aiPlanForUnit(state, unit, side, difficulty, params, rng) {
  const enemySide = side === 'A' ? 'B' : 'A';
  const enemies = state.teams[enemySide].filter(u => u.alive);
  const V = unit.available;
  const isAlarak = unit.formKey === 'alarak';
  const formFor = () => V >= 4 ? 'ad' : 'ds'; // 阿拉纳克形态启发式
  const mk = (fields, prio) => {
    const plan = {
      unitUid: unit.uid,
      formChoice: isAlarak ? formFor() : undefined,
      attack: null, defend: 0, save: 0, skills: [],
      ...fields,
    };
    if (hasSkill(unit, 'aggAtk')) plan.aggStance = plan.attack ? 'aggAtk' : (plan.defend > 0 ? 'aggDef' : undefined); // 常驻姿态启发式
    return { plan, prio };
  };
  const cands = [];
  const seen = new Set();
  const push = (cand) => {
    const key = JSON.stringify([cand.plan.formChoice, cand.plan.aggStance, cand.plan.attack, cand.plan.defend, cand.plan.save, cand.plan.skills]);
    if (seen.has(key)) return;
    seen.add(key);
    cands.push(cand);
  };

  // ① 全押攻 → 每个存活敌方
  for (const e of enemies) push(mk({ attack: { points: V, targetUid: e.uid } }, 60));
  // ② 斩杀攻：points = ceil((目标hp + q_防×目标available) / atk)（按 §13.4 公式）
  const qEnemy = aiOpponentQ(state, enemies[0], state.teams[side], side, difficulty, params, rng);
  for (const e of enemies) {
    const pts = Math.ceil((e.hp + qEnemy.def * e.available) / Math.max(1, unit.atk));
    if (pts > 0 && pts <= V) push(mk({ attack: { points: pts, targetUid: e.uid } }, 100));
  }
  // ③④ 全押防 / 全押存（hard 攒爆节奏提权）
  const hoardBoost = difficulty === 'hard' && unit.income <= 4 && V < 3 * unit.income;
  push(mk({ defend: V }, hoardBoost ? 70 : 20));
  push(mk({ save: V }, hoardBoost ? 70 : 10));
  // ⑤⑥ 对半
  const half = Math.floor(V / 2);
  if (half > 0 && enemies.length) {
    push(mk({ attack: { points: half, targetUid: enemies[0].uid }, defend: half }, 40));
    push(mk({ attack: { points: half, targetUid: enemies[0].uid }, save: half }, 30));
  }
  // ⑦ 技能组合（每个可用技能 × 纯技能 / +全押攻 / +全押存）
  const skillTarget = () => { // 目标类默认指向 q_技 最高敌方（1v1 即唯一敌方）
    let best = enemies[0];
    for (const e of enemies) if (aiOpponentQ(state, e, state.teams[side], side, difficulty, params, rng).skill > (aiOpponentQ(state, best, state.teams[side], side, difficulty, params, rng).skill || 0)) best = e;
    return best;
  };
  const st = enemies.length ? skillTarget() : null;
  for (const id of unit.skills) {
    const def = SKILLS[id];
    if (!def || (def.type !== 'active' && def.type !== 'form')) continue;
    if ((unit.cooldowns[id] || 0) > 0) continue;
    if (def.cost > V) continue;
    let targetUid;
    if (def.target === 'enemy') {
      targetUid = (st || enemies[0]).uid;
      if (difficulty === 'hard') { // §13.7 冷却纪律
        const t = unitByUid(state, targetUid);
        if (t && hasSkill(t, 'berserk')) continue;                       // 不对狂暴单位宣告
        if (id === 'bindRay' && qEnemy.skill <= 0.4) continue;           // 束缚需目标常用技能
        if (id === 'emp' && enemies[0].available < 8) continue;          // EMP 留给大点数回合
      }
    }
    const decl = { id, targetUid, count: 1 };
    if (id === 'trinity') decl.form = 'atk';
    if (id === 'insight') { decl.a = 'atk'; decl.b = 'def'; }
    if (id === 'ult' && difficulty === 'hard') continue; // 凯瑞甘纪律：大招只与防/存组合（⑧生成）
    const cost = def.cost || 0;
    const rest = V - cost;
    push(mk({ skills: [decl] }, 50));                                     // 纯技能
    if (rest > 0 && enemies.length) push(mk({ attack: { points: rest, targetUid: enemies[0].uid }, skills: [decl] }, 80));
    if (rest > 0) push(mk({ save: rest, skills: [decl] }, 55));
    if (id === 'trinity') { // 存形态配全押存
      push(mk({ save: V, skills: [{ id, form: 'sav' }] }, 45));
    }
  }
  // ⑧ 纪律候选（hard）：攒爆存已提权；凯瑞甘大招 + 全押防/存
  if (difficulty === 'hard' && unit.skills.includes('ult') && !(unit.cooldowns.ult > 0) && V >= SKILLS.ult.cost) {
    const rest = V - SKILLS.ult.cost;
    const decl = { id: 'ult', targetUid: enemies.length ? enemies[0].uid : undefined };
    push(mk({ defend: rest, skills: [decl] }, 75));
    push(mk({ save: rest, skills: [decl] }, 70));
  }

  // 去重后剪枝 ≤15：validatePlan 过滤非法，按优先级保留，交给评估层模拟
  return cands
    .filter(c => validatePlan(state, side, { [unit.uid]: c.plan }).ok)
    .sort((a, b) => b.prio - a.prio)
    .slice(0, 15)
    .map(c => c.plan);
}

/* ---------- §13.5 评估层：克隆 state 跑真 resolveRound 填收益矩阵 ---------- */
function aiOpponentPlans(state, enemies, side, q) {
  const myUnits = state.teams[side].filter(u => u.alive);
  const lowestHp = myUnits.slice().sort((a, b) => a.hp - b.hp)[0] || myUnits[0];
  const types = ['atk', 'def', 'save', 'skill'].sort((a, b) => q[b] - q[a]).slice(0, 3);
  const list = [];
  for (const e of enemies) {
    for (const ty of types) {
      const plan = {
        unitUid: e.uid,
        formChoice: e.formKey === 'alarak' ? 'ad' : undefined,
        attack: null, defend: 0, save: 0, skills: [],
      };
      if (ty === 'atk') plan.attack = { points: e.available, targetUid: lowestHp.uid };
      else if (ty === 'def') plan.defend = e.available;
      else if (ty === 'save') plan.save = e.available;
      else {
        const usable = e.skills.map(id => ({ id, d: SKILLS[id] }))
          .find(x => x.d && x.d.type === 'active' && !(e.cooldowns[x.id] > 0) && (x.d.cost || 0) <= e.available);
        if (usable) {
          const decl = { id: usable.id, count: 1 };
          if (usable.d.target === 'enemy') decl.targetUid = lowestHp.uid;
          if (usable.id === 'trinity') decl.form = 'atk';
          if (usable.id === 'insight') { decl.a = 'atk'; decl.b = 'def'; }
          plan.skills = [decl];
          const rest = e.available - (usable.d.cost || 0);
          if (rest > 0) plan.save = rest;
        } else {
          plan.attack = { points: e.available, targetUid: lowestHp.uid };
        }
      }
      if (hasSkill(e, 'aggAtk')) plan.aggStance = plan.attack ? 'aggAtk' : (plan.defend > 0 ? 'aggDef' : undefined);
      list.push({ type: ty, plan });
    }
  }
  return list;
}

function aiUtility(before, after, side) {
  const enemySide = side === 'A' ? 'B' : 'A';
  const power = (st, sd) => st.teams[sd].reduce((a, u) =>
    a + (u.alive ? u.hp : 0) + u.atk * 8 + u.income * 12 + u.bank * 0.5, 0);
  let U = (power(after, side) - power(before, side)) - (power(after, enemySide) - power(before, enemySide));
  const find = (st, sd, uid) => st.teams[sd].find(u => u.uid === uid);
  for (const u of before.teams[enemySide]) {
    const au = find(after, enemySide, u.uid);
    if (u.alive && au && !au.alive) U += 25 * (u.income + u.atk);
  }
  for (const u of before.teams[side]) {
    const au = find(after, side, u.uid);
    if (u.alive && au && !au.alive) U -= 25 * (u.income + u.atk);
  }
  return U;
}

/* ---------- §13.6 决策层：期望 + min 保底 + softmax 温度采样 ---------- */
function aiChoose(state, unit, side, enemies, cands, difficulty, params, rng) {
  const fallback = { unitUid: unit.uid, formChoice: unit.formKey === 'alarak' ? 'ad' : undefined, attack: null, defend: 0, save: 0, skills: [] };
  if (!cands.length || !enemies.length) return fallback;
  const q = aiOpponentQ(state, enemies[0], state.teams[side], side, difficulty, params, rng);

  // easy：30% 回合跳过模拟，直接反克最高 q 行动（克攻→防，克防→存，克存→攻）
  if (params.counterShortcutChance > 0 && rng() < params.counterShortcutChance) {
    const top = ['atk', 'def', 'save'].sort((a, b) => q[b] - q[a])[0];
    const want = top === 'atk' ? 'def' : (top === 'def' ? 'save' : 'atk');
    const V = unit.available;
    const hit = cands.find(c => want === 'def' ? (c.defend === V && !c.attack)
      : want === 'save' ? (c.save === V && !c.attack)
      : (c.attack && c.attack.points === V));
    if (hit) return hit;
  }

  const simBase = cloneState(state, true);
  const oppVariants = aiOpponentPlans(state, enemies, side, q);
  const qSum = oppVariants.reduce((a, v) => a + q[v.type], 0) || 1;
  const Us = cands.map(c => oppVariants.map(v => {
    const merged = { [unit.uid]: c, [v.plan.unitUid]: v.plan };
    const { state: after } = resolveRound(simBase, merged, { silent: true });
    return aiUtility(state, after, side);
  }));
  const scores = Us.map(row => {
    const exp = oppVariants.reduce((a, v, j) => a + (q[v.type] / qSum) * row[j], 0);
    return params.lambda * exp + (1 - params.lambda) * Math.min(...row);
  });
  return cands[aiSoftmaxPick(scores, params.temperature, rng)];
}

function aiSoftmaxPick(scores, T, rng) {
  const max = Math.max(...scores);
  const ws = scores.map(s => Math.exp((s - max) / Math.max(0.0001, T)));
  const total = ws.reduce((a, b) => a + b, 0);
  let r = rng() * total;
  for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) return i; }
  return ws.length - 1;
}
</script>

<!-- ============================================================
     UI 层：屏幕渲染与交互（唯一允许触碰 DOM 的层）
============================================================ -->
<script data-layer="UI">
'use strict';

const UI = (() => {
  const $ = id => document.getElementById(id);
  const app = {
    screen: 'title',
    mode: '1v1',
    aiEnabled: false,
    aiDifficulty: 'normal',
    game: null,
    pendingPlans: {},     // { uid: plan } 本回合已确认的规划（双方）
    currentPlayer: 'A',
    planQueue: [],        // 当前玩家待规划的单位 uid
    planIdx: 0,
    drafts: {},           // 当前玩家逐单位草稿
    lastEvents: [],
    helpReturn: 'title',
    select: { team: 'A', picks: { A: [], B: [] } },
    replicaQueue: [],     // 待选复制目标的复制者 uid
    replicas: [],         // [{ unit, target }]
    handoffGo: null,
  };

  function show(name) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    $('screen-' + name).classList.add('active');
    app.screen = name;
  }

  /* ---------- 通用工具 ---------- */
  function findUnit(uid) { return app.game ? unitByUid(app.game, uid) : null; }
  function playerName(t) {
    if (t === 'A') return '玩家 1（A 队）';
    return app.aiEnabled ? 'AI 对手（B 队）' : '玩家 2（B 队）';
  }
  function formLabel(u) {
    const fd = u.formKey ? FORM_DEFS[u.formKey] : null;
    return fd && fd.labels && fd.labels[u.form] ? fd.labels[u.form] : '';
  }
  function fmtPicks(arr) {
    return arr.length ? arr.map(id => CHARACTERS[id].name).join('、') : '（未选）';
  }

  /* ---------- 通用弹窗 ---------- */
  function showModal({ title, body, buttons }) {
    $('modal-title').textContent = title;
    $('modal-body').innerHTML = body;
    const acts = $('modal-actions');
    acts.innerHTML = '';
    for (const b of buttons) {
      const btn = document.createElement('button');
      btn.className = b.cls || 'ghost';
      btn.textContent = b.text;
      btn.addEventListener('click', () => { $('modal-mask').style.display = 'none'; if (b.onClick) b.onClick(); });
      acts.appendChild(btn);
    }
    $('modal-mask').style.display = 'flex';
  }

  /* ---------- 战场总览（炉石式大卡，规划/结算常驻顶部） ---------- */
  function renderBattlefield(id) {
    const card = u => {
      const hpPct = u.maxHp > 0 ? Math.max(0, Math.min(100, Math.round(u.hp / u.maxHp * 100))) : 0;
      const marks = Object.entries(u.cooldowns).filter(([, n]) => n > 0)
        .map(([sid, n]) => `<span class="mark bad">⏱${SKILLS[sid] ? SKILLS[sid].name : sid} ${n}</span>`).join('');
      const stanceMark = u.stance ? `<span class="mark gold">聚合${u.stance === 'aggAtk' ? '攻击' : '防御'}姿态</span>` : '';
      const soulMark = (u.soulMarks || 0) > 0 ? `<span class="mark bad">噬灵 ×${u.soulMarks}</span>` : '';
      return `<div class="bcard ${u.alive ? '' : 'dead'}">
        <div class="bc-head"><span class="bc-icon">${u.icon}</span><span>${u.name}</span>${formLabel(u) ? `<span class="bc-form">${formLabel(u)}</span>` : ''}</div>
        <div class="bc-hpbar"><div class="hp-fill" style="width:${hpPct}%"></div></div>
        <div class="bc-stats">
          <span class="bstat atk" title="攻击力">⚔ ${u.atk}</span>
          <span class="bstat hp" title="生命 / 上限">❤ ${u.hp}<small>/${u.maxHp}</small></span>
          <span class="bstat inc" title="每回合收入">💎 ${u.income}</span>
        </div>
        <div class="bc-econ"><span>可用 <b>${u.available}</b></span><span>存入 <b>${u.bank}</b></span></div>
        <div class="bc-marks">${stanceMark}${soulMark}${marks}</div>
        ${u.alive ? '' : '<div class="bc-deadtag">阵亡</div>'}
      </div>`;
    };
    $(id).innerHTML = `<div class="battlefield">
      <div class="bf-side"><div class="bf-label">🅰 A 队</div><div class="bf-cards">${app.game.teams.A.map(card).join('')}</div></div>
      <div class="bf-vs">VS</div>
      <div class="bf-side"><div class="bf-label">🅱 B 队</div><div class="bf-cards">${app.game.teams.B.map(card).join('')}</div></div>
    </div>`;
  }

  /* ---------- 标题屏 ---------- */
  function initTitle() {
    $('mode-row').addEventListener('click', e => {
      const btn = e.target.closest('.mode-btn');
      if (!btn) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      app.mode = btn.dataset.mode;
      $('ai-options').classList.toggle('visible', app.mode === '1v1');
      if (app.mode !== '1v1') $('ai-enabled').checked = false;
    });
    $('btn-start').addEventListener('click', () => {
      app.aiEnabled = app.mode === '1v1' && $('ai-enabled').checked;
      app.aiDifficulty = document.querySelector('input[name="ai-diff"]:checked').value;
      startSelect();
    });
    $('btn-help').addEventListener('click', () => { app.helpReturn = 'title'; renderHelp(); show('help'); });
    $('btn-help-back').addEventListener('click', () => show(app.helpReturn));
    $('btn-roster').addEventListener('click', () => { renderRoster(); show('roster'); });
    $('btn-roster-back').addEventListener('click', () => show('title'));
  }

  /* ---------- 角色图鉴 ---------- */
  function renderRoster() {
    $('roster-grid').innerHTML = Object.keys(CHARACTERS).map(id => {
      const c = CHARACTERS[id];
      const skills = skillFullHtml(c);
      return `<div class="roster-item">
        <div class="ri-head"><span>${c.icon}</span>${c.name}<span class="ri-tier cc-tier">${c.tier}</span></div>
        <div class="ri-stats"><span>攻击力 <b>${c.atk}</b></span><span>生命 <b>${c.hp}</b></span><span>收入 <b>${c.income}</b></span></div>
        <div class="ri-skills">${skills || '<span style="color:var(--text-dim)">无技能</span>'}</div>
      </div>`;
    }).join('');
  }

  function resetGame() {
    app.game = null;
    app.pendingPlans = {};
    app.drafts = {};
    app.lastEvents = [];
    app.currentPlayer = 'A';
    app.planQueue = [];
    app.planIdx = 0;
    app.select = { team: 'A', picks: { A: [], B: [] } };
    app.replicaQueue = [];
    app.replicas = [];
    app.handoffGo = null;
    app.aiThinking = false;
    if (app.aiTimer) { clearTimeout(app.aiTimer); app.aiTimer = null; }
    const ai = $('ai-thinking');
    if (ai) ai.style.display = 'none';
  }

  /* ---------- 选人屏 ---------- */
  function startSelect() {
    resetGame();
    renderSelect();
    show('select');
  }

  function skillBrief(c) {
    return c.skills.map(s => SKILLS[s].name).join(' · ') || (c.formKey ? '形态机制' : '—');
  }

  function skillFullHtml(c) {
    const skills = c.skills.map(sid => {
      const d = SKILLS[sid];
      return `<div class="cd-skill"><b>${d.name}</b> <span class="meta">[${d.cost ? `费用 ${d.cost}${d.stackable ? '/层' : ''}` : '免费'}｜${d.cooldown ? `冷却 ${d.cooldown}` : '无冷却'}｜${d.type === 'passive' ? '被动/常驻' : d.type === 'form' ? '形态' : d.type === 'special' ? '特殊' : '主动'}]</span><br>${d.desc}</div>`;
    });
    if (c.formKey === 'alarak') {
      skills.push(`<div class="cd-skill"><b>形态选择</b> <span class="meta">[免费｜每回合必选｜三选一]</span><br>①攻防一体：宣告攻 X 同时获得 X 防点、宣告防 X 同时获得 X 攻点　②防存一体：宣告防 X 同时存入 X、宣告存 X 同时获得 X 防点　③攻存一体：宣告攻 X 同时存入 X、宣告存 X 同时获得 X 攻点（按攻 2 计伤害）</div>`);
    }
    return skills.join('');
  }

  function renderCharDetail(id) {
    const el = $('char-detail');
    const c = CHARACTERS[id];
    if (!c) { el.innerHTML = '<span style="color:var(--text-dim)">点击任意角色卡，此处显示完整属性与技能说明</span>'; return; }
    el.innerHTML = `<div class="cd-name">${c.icon} ${c.name}　<span style="font-size:12px;color:var(--text-dim)">${c.tier}</span></div>
      <div class="cd-stats">攻击力 <b style="color:#ffab7e">${c.atk}</b> ｜ 生命 <b style="color:#7ef0ae">${c.hp}</b> ｜ 收入 <b style="color:var(--gold)">${c.income}</b></div>
      ${skillFullHtml(c) || '<span style="color:var(--text-dim)">无技能</span>'}`;
  }

  function renderSelect() {
    const cur = app.select.team;
    const n = MODE_UNIT_COUNT[app.mode];
    $('select-hint').textContent =
      `请 ${playerName(cur)} 选择 ${n} 名角色（同队不可重复；点击已选角色可取消）　·　⚔ 低阶（L）与高阶（H）差距较大，建议同阶对战`;
    const grid = $('char-grid');
    grid.innerHTML = '';
    for (const id of Object.keys(CHARACTERS)) {
      const c = CHARACTERS[id];
      const pickedHere = app.select.picks[cur].includes(id);
      // §5：同队去重；双方之间可以镜像同角色（跨队不互斥）
      const el = document.createElement('div');
      el.className = 'char-card' + (pickedHere ? ' selected' : '');
      el.dataset.charId = id;
      el.innerHTML = `
        <div class="cc-head"><span class="cc-icon">${c.icon}</span>${c.name}<span class="cc-tier">${c.tier}</span></div>
        <div class="cc-stats"><span>攻 <b>${c.atk}</b></span><span>血 <b>${c.hp}</b></span><span>收入 <b>${c.income}</b></span></div>
        <div class="cc-skills">${skillBrief(c)}</div>`;
      el.title = c.skills.map(s => `${SKILLS[s].name}：${SKILLS[s].desc}`).join('\n') || '（形态机制，见下方详情）';
      grid.appendChild(el);
    }
    $('lineup-strip').innerHTML =
      `A 队：${fmtPicks(app.select.picks.A)}　｜　B 队：${fmtPicks(app.select.picks.B)}`;
    $('btn-select-confirm').disabled = app.select.picks[cur].length !== n;
    $('btn-select-confirm').textContent = cur === 'A' ? '确认阵容，交对方选择' : '确认阵容，开始对局';
  }

  function onPickChar(id) {
    const cur = app.select.team, n = MODE_UNIT_COUNT[app.mode];
    const picks = app.select.picks[cur];
    const i = picks.indexOf(id);
    if (i >= 0) picks.splice(i, 1);
    else if (picks.length < n) picks.push(id);
    renderCharDetail(id); // 无论选/取消，都在下方详情面板展示完整技能说明
    renderSelect();
  }

  function confirmSelect() {
    if (app.select.team === 'A') {
      if (app.aiEnabled) {
        // AI 对手自动选人（UI 层随机 n 个不同角色，不受引擎确定性约束）
        const ids = Object.keys(CHARACTERS);
        const n = MODE_UNIT_COUNT[app.mode];
        while (app.select.picks.B.length < n) {
          const id = ids[Math.floor(Math.random() * ids.length)];
          if (!app.select.picks.B.includes(id)) app.select.picks.B.push(id);
        }
        afterSelection();
        return;
      }
      app.select.team = 'B';
      renderSelect();
    } else {
      afterSelection();
    }
  }

  /* ---------- 复制目标选择屏（复制者在场时，战斗开始前公开选择） ---------- */
  function afterSelection() {
    const reps = [];
    for (const t of ['A', 'B']) {
      app.select.picks[t].forEach((id, slot) => { if (CHARACTERS[id].replicator) reps.push(t + slot); });
    }
    app.replicaQueue = reps;
    app.replicas = [];
    if (reps.length) {
      // AI 持有的复制者自动选择目标（确定性规则：敌方收入最高的非复制者单位）
      if (app.aiEnabled) {
        while (app.replicaQueue.length && app.replicaQueue[0][0] === 'B') {
          const choices = [];
          app.select.picks.A.forEach((id, slot) => { if (!CHARACTERS[id].replicator) choices.push({ uid: 'A' + slot, income: CHARACTERS[id].income }); });
          choices.sort((a, b) => b.income - a.income);
          if (!choices.length) break;
          app.replicas.push({ unit: app.replicaQueue.shift(), target: choices[0].uid });
        }
      }
      if (app.replicaQueue.length) { renderCopyChoice(); show('copy'); }
      else startMatch();
    } else startMatch();
  }

  function renderCopyChoice() {
    const repUid = app.replicaQueue[0];
    $('copy-hint').textContent =
      `复制者（${repUid}）公开选择复制目标：复制其当前形态的攻/上限/收入与全部技能（含被动）；不能选择复制者（含自己）`;
    let html = '<div class="char-grid">';
    for (const t of ['A', 'B']) {
      app.select.picks[t].forEach((id, slot) => {
        const uid = t + slot;
        if (CHARACTERS[id].replicator) return;
        const c = CHARACTERS[id];
        html += `<div class="char-card" data-uid="${uid}">
          <div class="cc-head"><span class="cc-icon">${c.icon}</span>${c.name}<span class="cc-tier">${uid}${t === repUid[0] ? ' · 同队' : ' · 敌方'}</span></div>
          <div class="cc-stats"><span>攻 <b>${c.atk}</b></span><span>血 <b>${c.hp}</b></span><span>收入 <b>${c.income}</b></span></div>
        </div>`;
      });
    }
    $('copy-panel').innerHTML = html + '</div>';
  }

  function onCopyPick(uid) {
    app.replicas.push({ unit: app.replicaQueue.shift(), target: uid });
    if (app.replicaQueue.length) renderCopyChoice();
    else startMatch();
  }

  /* ---------- 回合循环 ---------- */
  function startMatch() {
    app.game = createGame(app.mode, app.select.picks.A, app.select.picks.B, {
      aiPlayer: app.aiEnabled ? 'B' : null,
      replicas: app.replicas,
    });
    startRound();
  }

  function startRound() {
    const r = beginRound(app.game);
    app.game = r.state;
    app.pendingPlans = {};
    app.drafts = {};
    app.currentPlayer = 'A';
    beginPlanning();
  }

  function beginPlanning() {
    if (app.currentPlayer === 'B' && app.aiEnabled) {
      const aiPlans = planWithAI(app.game, app.aiDifficulty, Math.random); // 计算先行同步完成
      Object.assign(app.pendingPlans, aiPlans);
      showAiThinking(); // 0.8–1.5s 纯视觉延迟，可跳过，不影响结果
      return;
    }
    app.planQueue = app.game.teams[app.currentPlayer].filter(u => u.alive).map(u => u.uid);
    app.planIdx = 0;
    showHandoff(
      `请将设备交给 <span class="pname">${playerName(app.currentPlayer)}</span>`,
      '我已就位，开始规划',
      showPlan,
    );
  }

  /* AI 思考浮层：计算已先行完成，延迟纯视觉（§13.8） */
  function showAiThinking() {
    const el = $('ai-thinking');
    el.style.display = 'flex';
    app.aiThinking = true;
    app.aiTimer = setTimeout(finishAiThinking, 800 + Math.random() * 700);
  }
  function finishAiThinking() {
    if (!app.aiThinking) return; // 防超时与手动跳过双触发
    app.aiThinking = false;
    if (app.aiTimer) { clearTimeout(app.aiTimer); app.aiTimer = null; }
    $('ai-thinking').style.display = 'none';
    showReveal();
  }

  function showHandoff(html, btnText, onGo, title = '行动保密') {
    $('screen-handoff').querySelector('h2').textContent = title;
    $('handoff-text').innerHTML = html;
    $('btn-handoff-ok').textContent = btnText;
    app.handoffGo = onGo;
    show('handoff');
  }

  function showReveal() {
    showHandoff('双方规划均已确认。<br>点击按钮同时揭示并结算本回合。', '▶ 揭示结算', reveal, '准备揭示');
  }

  function finishPlayerPlanning() {
    if (app.currentPlayer === 'A') {
      app.currentPlayer = 'B';
      beginPlanning();   // 内部处理 AI 直通
    } else {
      showReveal();
    }
  }

  /* ---------- 规划屏 ---------- */
  function curPlanUid() { return app.planQueue[app.planIdx]; }
  function initDraft(unit) {
    const d = { atk: 0, atkTarget: '', def: 0, save: 0, formChoice: '', aggStance: undefined, skills: {} };
    for (const id of unit.skills) {
      const def = SKILLS[id];
      if (def && (def.type === 'active' || def.type === 'form')) {
        d.skills[id] = { on: false, count: 1, targetUid: '', a: 'atk', b: 'def', form: '' };
      }
    }
    return d;
  }
  function curDraft() {
    const uid = curPlanUid();
    if (!app.drafts[uid]) app.drafts[uid] = initDraft(findUnit(uid));
    return app.drafts[uid];
  }
  function draftSpent(d) {
    let s = d.atk + d.def + d.save;
    for (const [id, v] of Object.entries(d.skills || {})) {
      if (v.on) { const def = SKILLS[id]; if (def && def.cost) s += def.cost * (v.count || 1); }
    }
    return s;
  }
  function buildPlan(d, unit) {
    const hasAgg = unit.skills.includes('aggAtk') || unit.skills.includes('aggDef');
    return {
      unitUid: unit.uid,
      formChoice: unit.formKey === 'alarak' ? (d.formChoice || undefined) : undefined,
      aggStance: hasAgg && d.aggStance !== undefined ? d.aggStance : undefined,
      // 攻点 > 0 即使未选目标也保留宣告，交由校验弹窗拦截（防静默丢弃）
      attack: d.atk > 0 ? { points: d.atk, targetUid: d.atkTarget || '' } : null,
      defend: d.def,
      save: d.save,
      skills: Object.entries(d.skills)
        .filter(([, v]) => v.on)
        .map(([id, v]) => ({
          id,
          targetUid: v.targetUid || undefined,
          count: v.count || 1,
          form: v.form || undefined,
          a: v.a, b: v.b,
        })),
    };
  }
  function draftErrors(d, unit) {
    return validatePlan(app.game, unit.team, { [unit.uid]: buildPlan(d, unit) }).errors;
  }

  function showPlan() { renderPlan(); show('plan'); }

  function updatePlanTopbar(unit, d) {
    const uid = curPlanUid();
    const spent = draftSpent(d);
    const lost = unit.available - spent;
    $('plan-topbar').innerHTML = `
      <span class="pt-title">第 ${app.game.round} 回合 · ${playerName(unit.team)}</span>
      <span>单位 ${app.planIdx + 1}/${app.planQueue.length}：<b>${unit.icon}${unit.name}</b>（${uid}）${formLabel(unit) ? ' · ' + formLabel(unit) : ''}</span>
      <span>可用 <span class="pt-num">${unit.available}</span></span>
      <span>已分配 <span class="pt-num small ${spent > unit.available ? 'warn' : ''}">${spent}</span></span>
      <span>将损失 <span class="pt-num small ${lost > 0 ? 'warn' : ''}">${lost}</span></span>
      ${spent > unit.available ? '<span class="warn">⚠ 超出可用点数</span>' : ''}`;
  }

  function updatePlanConfirm(unit, d) {
    const errs = draftErrors(d, unit);
    $('btn-plan-prev').disabled = app.planIdx === 0;
    $('btn-plan-confirm').textContent =
      (app.planIdx === app.planQueue.length - 1 ? '确认并完成本方规划' : '确认本单位规划')
      + (errs.length ? `（${errs[0]}）` : '');
    $('btn-plan-confirm').title = errs.join('；');
  }

  function commitUnitPlan(unit, d) {
    app.pendingPlans[unit.uid] = buildPlan(d, unit);
    app.planIdx++;
    if (app.planIdx < app.planQueue.length) renderPlan();
    else finishPlayerPlanning();
  }

  function renderPlan() {
    renderBattlefield('plan-battlefield');
    const uid = curPlanUid();
    const unit = findUnit(uid);
    const d = curDraft();
    const enemies = app.game.teams[unit.team === 'A' ? 'B' : 'A'].filter(u => u.alive);
    if (enemies.length === 1 && !d.atkTarget) d.atkTarget = enemies[0].uid; // 唯一敌方自动锁定，无需手选

    updatePlanTopbar(unit, d);

    const slider = key => `
      <div class="alloc-row">
        <label>${key === 'atk' ? '⚔ 攻击' : key === 'def' ? '🛡 防御' : '💰 存入'}</label>
        <input type="range" class="alloc-slider" min="0" max="${unit.available}" step="1" value="${d[key]}" data-slider="${key}">
        <span class="val" id="val-${key}">${d[key]}</span>
      </div>`;
    // 攻击目标独立成行、全宽醒目；1v1 直接显示锁定结果
    const targetRow = enemies.length === 1
      ? `<div class="alloc-row">
          <label>🎯 目标</label>
          <span class="target-fixed">${enemies[0].icon}${enemies[0].name}（${enemies[0].uid}）· 唯一敌方已自动锁定</span>
        </div>`
      : `<div class="alloc-row">
          <label>🎯 攻击目标</label>
          <select id="atk-target" class="target-select ${d.atk > 0 && !d.atkTarget ? 'need' : ''}">
            <option value="">— 点此选择攻击目标 —</option>
            ${enemies.map(e => `<option value="${e.uid}" ${d.atkTarget === e.uid ? 'selected' : ''}>${e.icon}${e.name}（${e.uid}）</option>`).join('')}
          </select>
        </div>`;

    const hasAgg = unit.skills.includes('aggAtk') || unit.skills.includes('aggDef');
    const curStance = d.aggStance !== undefined ? d.aggStance : unit.stance;

    $('plan-alloc').innerHTML = `
      ${unit.formKey === 'alarak' ? `
      <div class="alloc-group">
        <h4>阿拉纳克形态（每回合必选，免费）</h4>
        <div class="form-choice">
          ${FORM_DEFS.alarak.choices.map(c => `<button data-alarak-form="${c.id}" class="${d.formChoice === c.id ? 'on' : ''}">${c.label}</button>`).join('')}
        </div>
      </div>` : ''}
      ${hasAgg ? `
      <div class="alloc-group">
        <h4>聚合姿态（常驻生效，随时切换，持续到再次切换）</h4>
        <div class="form-choice">
          <button data-agg-stance="" class="${curStance === null ? 'on' : ''}">无姿态</button>
          <button data-agg-stance="aggAtk" class="${curStance === 'aggAtk' ? 'on' : ''}">聚合攻击（打全体敌方）</button>
          <button data-agg-stance="aggDef" class="${curStance === 'aggDef' ? 'on' : ''}">聚合防御（防点共享队友）</button>
        </div>
      </div>` : ''}
      <div class="alloc-group">
        <h4>基础行动（攻 / 防 / 存）</h4>
        ${slider('atk')}
        ${targetRow}
        ${slider('def')}
        ${slider('save')}
      </div>
      <p class="hint-line">未使用且未存入的点数回合末消失。克制三角：防御 克 攻击 · 攻击 克 存入 · 存入 克 防御。</p>`;

    const abOpts = sel => ['atk', 'def', 'save'].map(k =>
      `<option value="${k}" ${sel === k ? 'selected' : ''}>${k === 'atk' ? '攻' : k === 'def' ? '防' : '存'}</option>`).join('');
    const skillCard = id => {
      const def = SKILLS[id];
      const st = d.skills[id];
      const cd = unit.cooldowns[id] || 0;
      if (def.type === 'passive' || def.type === 'special') {
        return `<div class="skill-item off"><div class="si-main">
          <div class="si-name">${def.name}（${def.type === 'passive' ? '被动' : '特殊'}）</div>
          <div class="si-desc">${def.desc}</div></div></div>`;
      }
      let controls = '';
      if (st.on && cd === 0) {
        if (def.target === 'enemy') {
          controls += `<div class="alloc-row"><label>目标</label>
            <select class="sk-target" data-skill="${id}">
              <option value="">— 选择目标 —</option>
              ${enemies.map(e2 => `<option value="${e2.uid}" ${st.targetUid === e2.uid ? 'selected' : ''}>${e2.icon}${e2.name}（${e2.uid}）</option>`).join('')}
            </select></div>`;
        }
        if (id === 'insight') {
          controls += `<div class="alloc-row"><label>宣告</label>
            己方 <select class="sk-a" data-skill="${id}">${abOpts(st.a)}</select>
            归零目标 <select class="sk-b" data-skill="${id}">${abOpts(st.b)}</select></div>`;
        }
        if (def.stackable) {
          controls += `<div class="alloc-row"><label>层数</label>
            <span class="stepper">
              <button data-skill-step="${id}" data-delta="-1">−</button>
              <span class="sval">${st.count}</span>
              <button data-skill-step="${id}" data-delta="1">＋</button>
            </span><span class="hint-line">每层 ${def.cost} 点</span></div>`;
        }
        if (id === 'trinity') {
          controls += `<div class="form-choice">${FORM_DEFS.trinity.choices.map(c =>
            `<button data-triform="${id}" data-form="${c.id}" class="${st.form === c.id ? 'on' : ''}">${c.label}</button>`).join('')}</div>`;
        }
      }
      return `<div class="skill-item ${st.on && cd === 0 ? 'on' : 'off'}">
        <div class="si-main">
          <div class="si-name">${def.name}${def.type === 'form' ? '（形态）' : ''}
            <button class="sk-toggle" data-skill-toggle="${id}" ${cd > 0 ? 'disabled' : ''}>${cd > 0 ? `冷却中（剩 ${cd} 回合）` : (st.on ? '已宣告 ✓' : '宣告')}</button>
          </div>
          <div class="si-meta">${def.cost ? `<span class="cost">费用 ${def.cost}${def.stackable ? '/层' : ''}</span> · ` : '免费 · '}${def.cooldown ? `<span class="cd">冷却 ${def.cooldown}</span>` : '无冷却'}</div>
          <div class="si-desc">${def.desc}</div>
          ${controls}
        </div>
      </div>`;
    };
    const skillIds = unit.skills.filter(id => SKILLS[id] && !(hasAgg && (id === 'aggAtk' || id === 'aggDef')));
    $('plan-skills').innerHTML = `
      <div class="alloc-group"><h4>技能宣告</h4></div>
      ${skillIds.length ? `<div class="skill-list">${skillIds.map(skillCard).join('')}</div>`
        : '<p class="hint-line">该角色没有可显示的技能。</p>'}`;

    $('plan-unit-tabs').innerHTML = app.planQueue.map((u2, i) => {
      const unit2 = findUnit(u2);
      const done = i < app.planIdx || !!app.pendingPlans[u2];
      return `<span class="tab ${i === app.planIdx ? 'on' : ''} ${done ? 'done' : ''}" data-idx="${i}">${unit2.icon}${unit2.name}</span>`;
    }).join('');

    updatePlanConfirm(unit, d);
  }

  /* ---------- 揭示与结算报告 ---------- */
  function reveal() {
    const r = resolveRound(app.game, app.pendingPlans);
    app.game = r.state;
    app.lastEvents = r.events;
    renderReport();
    show('report');
  }

  function hlNums(text) { return text.replace(/\d+/g, m => `<b>${m}</b>`); }

  function renderReport() {
    renderBattlefield('report-battlefield');
    $('report-title').textContent = `第 ${app.game.round} 回合 · 结算报告`;
    $('btn-next-round').textContent = app.game.winner ? '查看结果 ▶' : '下一回合 ▶';
    const names = { R1: 'R1 回合开始', S1: 'S1 技能控制与修正', S2: 'S2 战斗', S3: 'S3 直接伤害技能', S4: 'S4 死亡清算', S5: 'S5 回合结束' };
    let html = '';
    for (const ph of ['R1', 'S1', 'S2', 'S3', 'S4', 'S5']) {
      const evs = app.lastEvents.filter(e => e.phase === ph);
      if (!evs.length) continue;
      html += `<div class="report-phase">${names[ph]}</div>`;
      html += evs.map(e => {
        const cls = 'ev' + (e.hl ? ' ev-' + e.hl : '');
        return `<div class="${cls}">${hlNums(e.text)}</div>`;
      }).join('');
    }
    $('report-log').innerHTML = html || '<div class="ev">（本回合无事件）</div>';
    $('report-log').scrollTop = 0;
  }

  function nextRound() {
    if (app.screen !== 'report') return; // 防御：只在结算报告屏允许进入下一回合（杜绝跳过结算的异常路径）
    if (app.game.winner) { renderEnd(); show('end'); }
    else startRound();
  }

  function renderEnd() {
    const w = app.game.winner;
    $('end-text').innerHTML = w === 'draw'
      ? '⚖️ 平局！双方同时倒下。'
      : `🏆 ${playerName(w)} 获胜！`;
  }

  /* ---------- 帮助屏：完整规则速查 ---------- */
  function renderHelp() {

      <p>· <b>S5 回合结束</b>：凯瑞甘大招 → 德哈卡形态切换 → 噬灵入账 → 清理临时效果 → 存入余额入账 → 胜负判定。</p>
      <h3>🛡 同时结算原则</h3>
      <p>· 所有行动基于规划期快照：宣告者中途死亡，其攻击/技能<b>照常结算</b>（凯瑞甘大招、德哈卡形态等回合末效果例外，宣告者已死则作废）。</p>
      <p>· 血量结算途中可为负，死亡统一在 S4 判定。</p>
      <h3>📺 界面战斗流程</h3>
      <p>· 选人（A→B 交替，同队去重）→ 复制者公开选复制目标 → 进入回合循环。</p>
      <p>· 每回合：<b>交接屏</b>（防偷看）→ 逐单位<b>规划</b>（滑块分配攻/防/存 + 技能宣告，实时校验超支与目标）→ 对方规划 → <b>▶ 揭示结算</b> → 按时间线展示<b>结算报告</b> → 下一回合。</p>
      <p>· 顶部战场总览常驻：双方角色卡显示攻击力 / 生命 / 收入 / 可用点数 / 存入余额 / 冷却与状态标记。</p>
      <p>· 1v1 可勾选 <b>AI 对手</b>（简单/普通/困难）：AI 自动选人并规划；「AI 思考中…」为纯视觉延迟，可点击跳过，不影响结果。</p>
      <h3>📜 其他要点</h3>
      <p>· 冷却「N」= 使用后接下来 N 个回合不可用；盾（临时生命）优先扣除，回合末清除。</p>
      <p>· 断牙狂暴：不受任何<b>其他单位</b>技能影响（敌我皆算，含增益）；但攻击与迷乱的目标集仍可命中他。</p>
      <p>· <b>常驻效果无需宣告</b>：势如破竹每回合自动瓦解敌方收入最高的未瓦解单位；塔萨达尔的聚合攻击/聚合防御为常驻姿态，随时切换。</p>`;
  }

  /* ---------- 事件绑定 ---------- */
  function init() {
    initTitle();

    $('char-grid').addEventListener('click', e => {
      const card = e.target.closest('.char-card');
      if (!card || card.classList.contains('disabled')) return;
      if (card.dataset.charId) onPickChar(card.dataset.charId);
    });
    $('btn-select-back').addEventListener('click', () => show('title'));
    $('btn-select-confirm').addEventListener('click', confirmSelect);

    $('copy-panel').addEventListener('click', e => {
      const card = e.target.closest('.char-card');
      if (card && card.dataset.uid) onCopyPick(card.dataset.uid);
    });

    $('btn-handoff-ok').addEventListener('click', () => {
      const f = app.handoffGo;
      app.handoffGo = null;
      if (f) f();
    });
    $('btn-ai-skip').addEventListener('click', finishAiThinking);

    $('plan-unit-tabs').addEventListener('click', e => {
      const tab = e.target.closest('.tab');
      if (!tab) return;
      const i = Number(tab.dataset.idx);
      if (app.planQueue[i]) { app.planIdx = i; renderPlan(); }
    });
    $('plan-alloc').addEventListener('click', e => {
      const alarak = e.target.closest('button[data-alarak-form]');
      if (alarak) { curDraft().formChoice = alarak.dataset.alarakForm; renderPlan(); return; }
      const agg = e.target.closest('button[data-agg-stance]');
      if (agg) { curDraft().aggStance = agg.dataset.aggStance === '' ? null : agg.dataset.aggStance; renderPlan(); }
    });
    $('plan-alloc').addEventListener('input', e => {
      const sl = e.target.closest('input[data-slider]');
      if (!sl) return;
      const d = curDraft();
      d[sl.dataset.slider] = Number(sl.value);
      const val = document.getElementById('val-' + sl.dataset.slider);
      if (val) val.textContent = sl.value;
      const unit = findUnit(curPlanUid());
      updatePlanTopbar(unit, d);   // 拖动中局部更新，不重建滑块
      updatePlanConfirm(unit, d);
    });
    $('plan-alloc').addEventListener('change', e => {
      if (e.target.id === 'atk-target') { curDraft().atkTarget = e.target.value; renderPlan(); return; }
      if (e.target.closest('input[data-slider]')) renderPlan(); // 松手后整体刷新
    });
    $('plan-skills').addEventListener('click', e => {
      const tg = e.target.closest('[data-skill-toggle]');
      if (tg && !tg.disabled) {
        const id = tg.dataset.skillToggle;
        const dd = curDraft();
        dd.skills[id].on = !dd.skills[id].on;
        if (dd.skills[id].on && id === 'aggAtk' && dd.skills.aggDef) dd.skills.aggDef.on = false; // ⚑R15
        if (dd.skills[id].on && id === 'aggDef' && dd.skills.aggAtk) dd.skills.aggAtk.on = false;
        renderPlan();
        return;
      }
      const ss = e.target.closest('[data-skill-step]');
      if (ss) {
        const unit = findUnit(curPlanUid());
        const def = SKILLS[ss.dataset.skillStep];
        const max = Math.max(1, Math.floor(unit.available / (def.cost || 1)));
        const st = curDraft().skills[ss.dataset.skillStep];
        st.count = Math.max(1, Math.min(max, st.count + Number(ss.dataset.delta)));
        renderPlan();
        return;
      }
      const tf = e.target.closest('[data-triform]');
      if (tf) {
        curDraft().skills[tf.dataset.triform].form = tf.dataset.form;
        renderPlan();
      }
    });
    $('plan-skills').addEventListener('change', e => {
      const t = e.target;
      if (t.classList.contains('sk-target')) { curDraft().skills[t.dataset.skill].targetUid = t.value; renderPlan(); }
      else if (t.classList.contains('sk-a')) { curDraft().skills[t.dataset.skill].a = t.value; renderPlan(); }
      else if (t.classList.contains('sk-b')) { curDraft().skills[t.dataset.skill].b = t.value; renderPlan(); }
    });
    $('btn-plan-prev').addEventListener('click', () => {
      if (app.planIdx > 0) { app.planIdx--; renderPlan(); }
    });
    $('btn-plan-confirm').addEventListener('click', () => {
      const uid = curPlanUid();
      const unit = findUnit(uid);
      const d = curDraft();
      // ① 分配了攻点却没选目标 → 专门弹窗提醒（高频遗忘点）
      if (d.atk > 0 && !d.atkTarget) {
        showModal({
          title: '⚠ 未选择攻击目标',
          body: `已分配 <b style="color:var(--gold)">${d.atk}</b> 点攻击，但还没有选择攻击目标。<br>请在「🎯 攻击目标」中点选，或把攻击滑块调回 0。`,
          buttons: [{ text: '返回修改', cls: 'primary' }],
        });
        return;
      }
      // ② 其余硬性错误（超支 / 形态未选等）→ 弹窗阻断
      const errs = draftErrors(d, unit);
      if (errs.length) {
        showModal({
          title: '⚠ 无法提交',
          body: errs.map(e => '· ' + e).join('<br>'),
          buttons: [{ text: '返回修改', cls: 'primary' }],
        });
        return;
      }
      // ③ 点数未用完 → 二次确认，防手滑浪费
      const lost = unit.available - draftSpent(d);
      if (lost > 0) {
        // 点数未用完 → 弹窗二次确认，防手滑浪费
        showModal({
          title: '提交确认',
          body: `还有 <b style="color:var(--gold)">${lost}</b> 点既未分配也未存入，回合末将直接消失。<br>确定按当前方案提交吗？`,
          buttons: [
            { text: '返回修改', cls: 'ghost' },
            { text: '确认提交', cls: 'primary', onClick: () => commitUnitPlan(unit, d) },
          ],
        });
        return;
      }
      commitUnitPlan(unit, d);
    });

    $('btn-next-round').addEventListener('click', nextRound);
    $('btn-restart').addEventListener('click', () => { resetGame(); show('title'); });
  }

  return { init, show, app };
})();

document.addEventListener('DOMContentLoaded', () => UI.init());
</script>

     TEST 层：?test=1 自测框架（规格 §9）

<script data-layer="TEST">
'use strict';

const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }
function assert(cond, msg) { if (!cond) throw new Error(msg == null ? '断言失败' : String(msg)); }
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((msg || '不相等') + `：实际 ${a}，期望 ${b}`);
}

function runAllTests() {
  const results = [];
  let passed = 0, failed = 0;
  for (const t of TESTS) {
    const r = { name: t.name, ok: true, error: null, ms: 0 };
    const t0 = Date.now();
    try { t.fn(); } catch (e) { r.ok = false; r.error = e.message; }
    r.ms = Date.now() - t0;
    if (r.ok) passed++; else failed++;
    results.push(r);
  }
  return { total: TESTS.length, passed, failed, results };
}
