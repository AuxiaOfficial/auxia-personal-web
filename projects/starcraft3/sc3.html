/* ============ M1：核心公式（8 条） ============ */
function mirror() { return createGame('1v1', ['L2'], ['L2']); } // 圣堂武士镜像：攻3 血30 收6
function planAtk(uid, pts, target) { return { unitUid: uid, attack: { points: pts, targetUid: target }, defend: 0, save: 0, skills: [] }; }
function planDef(uid, pts) { return { unitUid: uid, attack: null, defend: pts, save: 0, skills: [] }; }
function planSave(uid, pts) { return { unitUid: uid, attack: null, defend: 0, save: pts, skills: [] }; }

test('M1 核心: 攻防抵扣 伤害=(攻−实扣防)×攻击力', () => {
  const { state: s } = beginRound(mirror());
  eq(s.teams.A[0].available, 6, 'R1 收入 6');
  eq(s.teams.B[0].available, 6, 'R1 收入 6');
  const r = resolveRound(s, { A0: planAtk('A0', 5, 'B0'), B0: planDef('B0', 3) });
  const a = r.state.teams.A[0], b = r.state.teams.B[0];
  eq(b.hp, 30 - (5 - 3) * 3, 'B 应受 6 伤');
  eq(a.hp, 30, 'A 无伤');
  eq(a.available, 0, 'A 点数全部消耗');
  eq(a.bank, 0, 'A 无存入');
  eq(b.bank, 0, 'B 防御非存入');
  const atkEv = r.events.find(e => e.type === 'attack');
  eq(atkEv.values, { points: 5, def: 3, power: 3, dmg: 6, shieldAbs: 0, countered: false }, '攻击事件数值');
});

test('M1 核心: 攻≤防 无伤（防点按 min 消耗）', () => {
  const { state: s } = beginRound(mirror());
  const r = resolveRound(s, { A0: planAtk('A0', 2, 'B0'), B0: planDef('B0', 5) });
  eq(r.state.teams.B[0].hp, 30, '无伤');
  const atkEv = r.events.find(e => e.type === 'attack');
  eq(atkEv.values, { points: 2, def: 2, power: 3, dmg: 0, shieldAbs: 0, countered: false }, '实扣防 = min(5,2) = 2');
});

test('M1 核心: 攻克存全额生效', () => {
  const { state: s } = beginRound(mirror());
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planSave('B0', 6) });
  eq(r.state.teams.B[0].hp, 30 - 6 * 3, '存入不提供保护，全额 18 伤');
});

test('M1 核心: 存点保留（被攻击仍结转，不没收）', () => {
  const { state: s } = beginRound(mirror());
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planSave('B0', 6) });
  eq(r.state.teams.B[0].bank, 6, '被全额命中但存入保留');
  eq(r.state.teams.B[0].available, 0, 'available 清零');
});

test('M1 核心: 存入结转至下回合', () => {
  const r1 = resolveRound(beginRound(mirror()).state, { A0: planAtk('A0', 6, 'B0'), B0: planSave('B0', 6) });
  const r2 = beginRound(r1.state);
  eq(r2.state.teams.B[0].available, 12, '收入 6 + 结转 6');
  eq(r2.state.teams.B[0].bank, 0, '结转后清零');
  eq(r2.state.teams.A[0].available, 6, 'A 无存入仅收入');
});

test('M1 核心: 存克防（防御点白白消耗）', () => {
  const { state: s } = beginRound(mirror());
  const r = resolveRound(s, { A0: planSave('A0', 6), B0: planDef('B0', 6) });
  const a = r.state.teams.A[0], b = r.state.teams.B[0];
  eq(b.hp, 30, 'B 无伤');
  eq(a.bank, 6, 'A 安全积累');
  eq(b.bank, 0, 'B 防御点白白消耗');
  eq(r.events.filter(e => e.type === 'attack').length, 0, '无攻击事件');
});

test('M1 核心: 点数未用直接损失', () => {
  const { state: s } = beginRound(mirror());
  const r = resolveRound(s, { A0: planAtk('A0', 1, 'B0'), B0: planSave('B0', 6) });
  const waste = r.events.find(e => e.type === 'waste');
  eq(waste.values.wasted, 5, 'A 损失 5 点');
  const r2 = beginRound(r.state);
  eq(r2.state.teams.A[0].available, 6, '下回合仅收入，浪费点不结转');
});

test('M1 核心: 冷却递减', () => {
  const g = mirror();
  g.teams.A[0].cooldowns = { execute: 3 };
  const r1 = beginRound(g);
  eq(r1.state.teams.A[0].cooldowns.execute, 2);
  const r2 = beginRound(r1.state);
  eq(r2.state.teams.A[0].cooldowns.execute, 1);
  const r3 = beginRound(r2.state);
  eq(r3.state.teams.A[0].cooldowns.execute, 0, '恢复可用');
});

/* ============ M1：防御池（3 条） ============ */
// 同队不可重复角色：用 L2（圣堂武士 3/30/6）+ L10（伏击者 3/28/6），攻/收入一致便于复算
function mirror2v2() { return createGame('2v2', ['L2', 'L10'], ['L2', 'L10']); }

test('M1 防御池: 单攻击抵扣', () => {
  const { state: s } = beginRound(mirror2v2());
  const r = resolveRound(s, { A0: planAtk('A0', 4, 'B0'), A1: planSave('A1', 6), B0: planDef('B0', 6), B1: planSave('B1', 6) });
  const atkEv = r.events.find(e => e.type === 'attack');
  eq(atkEv.values, { points: 4, def: 4, power: 3, dmg: 0, shieldAbs: 0, countered: false }, '池 6 抵 4');
  eq(r.state.teams.B[0].hp, 30);
});

test('M1 防御池: 双攻击按攻点降序消耗（⚑R1）', () => {
  const { state: s } = beginRound(mirror2v2());
  const r = resolveRound(s, { A0: planAtk('A0', 3, 'B0'), A1: planAtk('A1', 5, 'B0'), B0: planDef('B0', 6) });
  const evs = r.events.filter(e => e.type === 'attack');
  eq(evs.length, 2);
  eq(evs[0].values, { points: 5, def: 5, power: 3, dmg: 0, shieldAbs: 0, countered: false }, '5 点攻击先结算，全抵');
  eq(evs[1].values, { points: 3, def: 1, power: 3, dmg: 6, shieldAbs: 0, countered: false }, '3 点攻击只抵剩 1');
  eq(r.state.teams.B[0].hp, 24, 'B 受 6 伤');
});

test('M1 防御池: 池耗尽后穿透', () => {
  const { state: s } = beginRound(mirror2v2());
  const r = resolveRound(s, { A0: planAtk('A0', 5, 'B0'), A1: planAtk('A1', 3, 'B0'), B0: planDef('B0', 2) });
  const evs = r.events.filter(e => e.type === 'attack');
  eq(evs[0].values, { points: 5, def: 2, power: 3, dmg: 9, shieldAbs: 0, countered: false }, '池 2 抵 5 中 2');
  eq(evs[1].values, { points: 3, def: 0, power: 3, dmg: 9, shieldAbs: 0, countered: false }, '池空穿透全额');
  eq(r.state.teams.B[0].hp, 12, 'B 受 18 伤');
});

/* ============ M1：交互时序（4 条） ============ */

test('M1 时序: 宣告者死亡其攻击仍结算（⚑R2）', () => {
  const { state: s } = beginRound(mirror());
  s.teams.B[0].hp = 5; // A 攻 6 点 ×3 = 18 伤 → B 中途 HP 为负但 S4 才判死
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planAtk('B0', 4, 'A0') });
  eq(r.state.teams.A[0].hp, 18, 'B 死前宣告的攻击照常结算');
  eq(r.state.teams.B[0].alive, false, 'B 在 S4 死亡');
  eq(r.state.winner, 'A');
});

test('M1 时序: 双方同时全灭 → 平局', () => {
  const { state: s } = beginRound(mirror());
  s.teams.A[0].hp = 5;
  s.teams.B[0].hp = 5;
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planAtk('B0', 6, 'A0') });
  eq(r.state.teams.A[0].alive, false);
  eq(r.state.teams.B[0].alive, false);
  eq(r.state.winner, 'draw');
});

test('M1 时序: 一方全灭 → 另一方胜', () => {
  const { state: s } = beginRound(mirror());
  s.teams.B[0].hp = 5;
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planAtk('B0', 2, 'A0') });
  eq(r.state.teams.B[0].alive, false, 'B 受 18 伤阵亡');
  eq(r.state.teams.A[0].alive, true, 'A 受 6 伤存活');
  eq(r.state.winner, 'A');
});

test('M1 时序: 死亡单位存入作废且次回合无收入', () => {
  const { state: s } = beginRound(mirror());
  s.teams.B[0].hp = 5;
  const r = resolveRound(s, { A0: planAtk('A0', 6, 'B0'), B0: planSave('B0', 6) });
  eq(r.state.teams.B[0].alive, false);
  eq(r.state.teams.B[0].bank, 0, '死亡单位存入作废');
  const r2 = beginRound(r.state);
  eq(r2.state.teams.B[0].available, 0, '死亡单位无收入');
  eq(r2.state.teams.A[0].available, 6, '存活单位正常收入');
});

/* ============ M1 附加：校验 / 确定性 / 全局脚本对局 ============ */

test('M1 校验: 超支计划被拒', () => {
  const { state: s } = beginRound(mirror());
  const v = validatePlan(s, 'A', { A0: planAtk('A0', 7, 'B0') });
  eq(v.ok, false);
  assert(v.errors.some(e => e.includes('超过可用')), '应有超支错误');
});

test('M1 校验: 非法攻击目标被拒（自己/友方/死亡/不存在）', () => {
  const { state: s } = beginRound(mirror());
  eq(validatePlan(s, 'A', { A0: planAtk('A0', 3, 'A0') }).ok, false, '目标=自己');
  eq(validatePlan(s, 'A', { A0: planAtk('A0', 3, 'X9') }).ok, false, '目标不存在');
  const s2 = beginRound(mirror()).state;
  s2.teams.B[0].alive = false;
  eq(validatePlan(s2, 'A', { A0: planAtk('A0', 3, 'B0') }).ok, false, '目标已死亡');
});

test('M1 校验: 冷却中技能被拒，费用不足被拒，凑齐后通过', () => {

/* ============ M5：AI 对手（§13.9 五类测试） ============ */
function mulberry32(seed) { // 固定种子 rng（可复现）
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function aiDoubleRound(state, difficulty, rng) { // 双 AI 一回合；返回 { state, plans }
  state = beginRound(state, { silent: true }).state;
  state.aiPlayer = 'A';
  const pa = planWithAI(state, difficulty, rng);
  state.aiPlayer = 'B';
  const pb = planWithAI(state, difficulty, rng);
  const va = validatePlan(state, 'A', pa);
  const vb = validatePlan(state, 'B', pb);
  const r = resolveRound(state, { ...pa, ...pb }, { silent: true });
  return { state: r.state, plans: { pa, pb }, va, vb };
}
function aiFuzzSetup(a, b) { // 复制者组合自动给复制目标；双双复制者跳过（返回 null）
  const opts = { aiPlayer: 'B' };
  if (a === 'H10' && b === 'H10') return null; // 复制者不能互copy，整场无解，跳过
  if (a === 'H10') opts.replicas = [{ unit: 'A0', target: 'B0' }];
  if (b === 'H10') opts.replicas = [{ unit: 'B0', target: 'A0' }];
  return createGame('1v1', [a], [b], opts);
}

test('M5 AI: 合法性 fuzz —— 20×20 镜像 × 3 难度 × ≤30 回合（固定种子）', () => {
  const ids = Object.keys(CHARACTERS);
  let games = 0, plansChecked = 0, rounds = 0;
  for (const difficulty of ['easy', 'normal', 'hard']) {
    for (let i = 0; i < ids.length; i++) {
      for (let j = 0; j < ids.length; j++) {
        const setup = aiFuzzSetup(ids[i], ids[j]);
        if (!setup) continue;
        let state = setup;
        const rng = mulberry32(i * 131 + j * 17 + 5);
        games++;
        for (let rd = 0; rd < 30 && !state.winner; rd++) {
          const { state: ns, va, vb } = aiDoubleRound(state, difficulty, rng);
          eq(va.ok, true, `${ids[i]}vs${ids[j]}/${difficulty} A 计划非法: ${va.errors.join('；')}`);
          eq(vb.ok, true, `${ids[i]}vs${ids[j]}/${difficulty} B 计划非法: ${vb.errors.join('；')}`);
          plansChecked += 2;
          for (const u of [...ns.teams.A, ...ns.teams.B]) {
            assert(Number.isFinite(u.hp) && Number.isFinite(u.available) && Number.isFinite(u.bank), '出现 NaN 状态');
          }
          state = ns;
          rounds++;
        }
      }
    }
  }
  assert(games >= 398, '镜像组合数不足');
  console.log(`[fuzz] ${games} 局 / ${rounds} 回合 / ${plansChecked} 份计划全部合法`);
});

test('M5 AI: 强度 sanity —— hard vs 永远全押攻 / 永远全押存 ≥ 9/10', () => {
  // 对局设计说明：L2 镜像 vs 全押攻 bot 时双方收入相同，AI 每轮净血量收益 ≤0，数学上最多平局；
  // 故攻 bot 选用收入更低的 L8(SCV 4/轮)，体现「AI 惩罚固定策略」的测试本意。
  const play = (botChar, botFn) => {
    let wins = 0;
    for (let g = 0; g < 10; g++) {
      let state = createGame('1v1', [botChar], ['L2'], { aiPlayer: 'B' });
      const rng = mulberry32(9000 + g * 13);
      let guard = 0;
      while (!state.winner && guard++ < 100) {
        state = beginRound(state, { silent: true }).state;
        const bot = botFn(state);
        state.aiPlayer = 'B';
        const ai = planWithAI(state, 'hard', rng);
        state = resolveRound(state, { ...bot, ...ai }, { silent: true }).state;
      }
      if (state.winner === 'B') wins++;
    }
    return wins;
  };
  const vsAtk = play('L8', s => ({ A0: planAtk('A0', s.teams.A[0].available, 'B0') }));
  const vsSave = play('L2', s => ({ A0: planSave('A0', s.teams.A[0].available) }));
  console.log(`[强度] hard vs 全押攻(SCV) ${vsAtk}/10，vs 全押存 ${vsSave}/10`);
  assert(vsAtk >= 9, 'hard vs 全押攻 胜率不足');
  assert(vsSave >= 9, 'hard vs 全押存 胜率不足');
});

  const g = createGame('2v2', ['L5', 'L3'], ['L2', 'L10']); // A0 断牙 + A1 塔萨达尔
  const { state: s } = beginRound(g);
  const r = resolveRound(s, { A1: { unitUid: 'A1', aggStance: 'aggDef', attack: null, defend: 6, save: 0, skills: [] }, B0: planAtk('B0', 4, 'A0') });
  assert(r.events.some(e => e.type === 'immune' && e.dst === 'A0'), '断牙拒绝聚合防御赠予');
  eq(r.state.teams.A[0].hp, 32 - 12, '断牙(血32)无赠予防御 → 4×3=12 伤');
});

test('M2 无冷却回归: 识破无冷却 —— 连续每回合可宣告，不登记冷却', () => {
  const decl = () => ({ unitUid: 'A0', attack: null, defend: 0, save: 0, skills: [{ id: 'insight', targetUid: 'B0', a: 'atk', b: 'def' }] });
  let s = resolveRound(beginRound(createGame('1v1', ['L4'], ['L2'])).state, { A0: decl() }).state;
  eq(s.teams.A[0].cooldowns.insight, undefined, '不登记冷却');
  for (let i = 0; i < 3; i++) {
    s = beginRound(s).state;
    eq(validatePlan(s, 'A', { A0: decl() }).ok, true, `R${i + 2} 仍可宣告`);
    s = resolveRound(s, { A0: decl() }).state;
  }
  eq(s.teams.A[0].cooldowns.insight, undefined, '连续使用无冷却累积');
});

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  window.addEventListener('DOMContentLoaded', () => {

    const res = runAllTests();
    const root = document.getElementById('app');
    root.innerHTML = '<div id="test-root"><h1>星际争霸 III · 自测框架</h1>' +
      `<div class="summary">${res.total} 用例，${res.passed} 通过` +
      (res.failed ? `，<span style="color:#ff6b7a">${res.failed} 失败</span>` : '，全部通过 ✅') +
      `（耗时 ${res.results.reduce((a, r) => a + r.ms, 0)}ms）</div>` +
      res.results.map(r => `<div class="case ${r.ok ? 'pass' : 'fail'}">${r.ok ? '✔' : '✘'} ${r.name}` +
        (r.ok ? '' : `<span class="err">${r.error}</span>`) + `</div>`).join('') +
      '</div>';
    console.log('[TEST]', res.total + ' 用例', res.passed + ' 通过', res.failed + ' 失败');
    for (const r of res.results) console.log((r.ok ? 'PASS' : 'FAIL') + ' | ' + r.name + (r.ok ? '' : ' | ' + r.error));
  });
}
